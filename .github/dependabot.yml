# B6 (auditoría 2026-07-16, S11): actualizaciones de dependencias automatizadas.
# Agrupadas para no inundar de PRs: minor+patch juntos, majors aparte (revisión
# manual). Las alertas de seguridad de Dependabot se activan en Settings →
# Code security (ver SECURITY.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 5
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]
      # React y ReactDOM NO son dos dependencias, son una: `react@19` con
      # `react-dom@18` ni siquiera instala — `npm ci` aborta por peers antes de
      # compilar nada. Los minor/patch ya viajaban juntos por el grupo de
      # arriba, pero los MAJORS van por dependencia, así que en agosto/2026
      # Dependabot abrió #734 y #735 con cada mitad de React 19: los dos rojos
      # en 8-12 segundos, y ninguno fusionable ni siquiera en el orden correcto,
      # porque el primero en entrar rompe main. Este grupo los une, majors
      # incluidos, para que el PR llegue completo o no llegue.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["major", "minor", "patch"]
    labels: ["dependencies"]
    # Majors que Dependabot NO debe reabrir solo. Cada uno rompe el pipeline de
    # una forma distinta y ninguno se arregla mergeando el PR tal cual; hay que
    # migrar a mano. Sin estas reglas el PR vuelve cada lunes y deja un
    # deployment ROJO en Vercel (Vercel construye un preview por PR).
    ignore:
      # typescript@6/7 no resuelve: typescript-eslint@8 declara el peer
      # `typescript >=4.8.4 <6.1.0`, así que `npm ci` aborta con ERESOLVE
      # ANTES de compilar nada — el preview de Vercel falla en la instalación.
      # Levantar este ignore cuando typescript-eslint amplíe ese rango.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # zod@4 cambia la API de errores (`.issues`, formato de `invalid_format`)
      # y los schemas de dominio dependen de ella. Ojo: el build de Vercel NO
      # corre `tsc` ni los tests, así que este PR sale VERDE en Vercel mientras
      # CI está en rojo — mergearlo desplegaría validaciones rotas. Levantar
      # este ignore junto con la migración de los schemas a la API v4.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 3
    labels: ["dependencies"]
