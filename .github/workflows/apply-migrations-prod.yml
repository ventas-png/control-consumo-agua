name: Apply Migrations to Production

# Auto-aplica a PRODUCCIÓN las migraciones SQL que aterrizan en `main`, para que
# el esquema de Supabase nunca se quede DETRÁS del código. Lección anti-drift:
# durante junio/2026 varios PRs con migraciones se mergearon a `main` sin que el
# SQL llegara a prod (había que dispararlo a mano con el viejo apply-migration.yml
# —ya eliminado— o por MCP);
# este workflow cierra ese hueco automáticamente.
#
# Mecanismo: Management API de Supabase (POST /v1/projects/{id}/database/query),
# el MISMO que usaba el viejo apply-migration.yml. NO usa `supabase db push` a propósito:
# el historial remoto schema_migrations quedó desalineado (algunas migraciones se
# aplicaron a mano/MCP con versión de apply-time, no la del archivo) y `db push`
# abortaría por checksum/orden.
#
# ⚠️ REAPLICAR NO ES SEGURO. Aquí se leía que el SQL de las migraciones es
# idempotente (CREATE ... IF NOT EXISTS, DROP POLICY IF EXISTS → CREATE POLICY)
# "así que reaplicar siempre es seguro". Es FALSO, y es la premisa exacta que
# tumbó producción el 2026-08-03: el reconciliador dio por pendientes 257
# migraciones ya aplicadas y las reejecutó; entre ellas
# 20260320000000_fix_superadmin_app_users_uuid, que empieza con
# `DROP TABLE IF EXISTS public.app_users CASCADE`. Ese `IF EXISTS` es idempotente
# en la FORMA —no falla si se repite— pero destructivo en el EFECTO: se llevó
# todos los perfiles y hubo que restaurar el backup.
#
# La idempotencia de una sentencia no dice nada sobre si es seguro repetirla con
# datos dentro. Por eso el historial de `schema_migrations` es la fuente de
# verdad y su registro es FAIL-CLOSED (ver el paso de aplicación): una versión
# aplicada y no registrada es justo la que el reconciliador vuelve a ejecutar.
#
# Disparadores:
#   - push a `main` que toque supabase/migrations/** → aplica SOLO los .sql
#     añadidos/modificados en ese push (en orden de versión) y los registra en
#     supabase_migrations.schema_migrations.
#   - manual (workflow_dispatch):
#       · con `migration_file` → aplica ESE archivo.
#       · sin input → modo RECONCILIAR: aplica toda migración local cuya versión
#         no esté registrada en el historial remoto (sana el drift de una vez).
#
# `paths` está acotado a supabase/migrations/** para que la PROPIA introducción
# de este workflow (un cambio solo en .github/) NO se auto-dispare.
#
# Requiere los secrets SUPABASE_ACCESS_TOKEN y SUPABASE_PROJECT_ID. Sin ellos el
# job falla con instrucciones.
#
# Esta es la ÚNICA vía de CI hacia la base de producción. El antiguo
# apply-migration.yml se eliminó (auditoría 2026-05-26, I9): aplicaba SQL al MISMO
# proyecto sin `environment: production-db`, sin el cortafuegos append-only y sin
# MAX_APPLY, e interpolaba la entrada del dispatch directamente en el shell.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Archivo único a aplicar (en supabase/migrations/). Vacío = reconciliar todos los pendientes.'
        required: false
        default: ''

concurrency:
  # No cancelar una aplicación a medias: encolar.
  group: apply-migrations-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # La verificación de secretos NO es un job aparte. Lo fue, y eso rompe en cuanto
  # los secrets se restringen al Environment `production-db` —que es justo lo que
  # este workflow quiere permitir—: un job sin `environment:` no puede leer
  # environment secrets, así que `check-secrets` los vería SIEMPRE vacíos y
  # fallaría el workflow entero antes de llegar al apply, con un mensaje que
  # además culpa al operador de no haberlos cargado.
  #
  # Meterle `environment: production-db` al job de verificación tampoco sirve:
  # cada job asociado a un Environment con Required reviewers pide su PROPIA
  # aprobación, así que el operador tendría que aprobar dos veces la misma
  # ejecución — y la segunda, sobre un job cuya única función es comprobar que
  # las variables no están vacías.
  #
  # Por eso la comprobación vive DENTRO de `apply`, como su primer paso: hereda
  # el Environment (lee los secrets, estén donde estén), corre después del único
  # gate de aprobación y sigue abortando antes de cualquier llamada a la API.
  apply:
    runs-on: ubuntu-latest
    # P0 #9 (auditoría 2026-07-10): gate de aprobación antes de escribir a prod.
    # Este job aplica SQL a la base de PRODUCCIÓN; asociarlo a un Environment
    # permite exigir aprobación humana (Settings → Environments → `production-db`
    # → Required reviewers). Mientras el Environment no tenga reglas de protección,
    # el job corre igual (no bloquea) — así este cambio es seguro de mergear y el
    # gate se activa cuando el owner configure los reviewers. También permite
    # restringir los secrets de Supabase a este Environment.
    environment: production-db
    env:
      API_URL: https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/database/query
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Se expone aparte del API_URL para poder comprobar que NO está vacío: sin
      # él la URL queda como .../projects//database/query y el fallo aparecería
      # más tarde como un 404 críptico en mitad del apply.
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_FILE: ${{ github.event.inputs.migration_file }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
      # Tope duro de migraciones por corrida (ver el paso `list`). Mismo criterio
      # que el MAX_DELETIONS de cleanup-preview-branches: acotar el daño de una
      # selección disparatada en vez de ejecutarla entera contra producción.
      MAX_APPLY: '10'
    steps:
      # PRIMER paso del job, antes del checkout: si faltan los secretos no hay
      # nada que hacer y se aborta sin haber tocado nada. Los valores se leen por
      # `env` (arriba) y NUNCA se interpolan en el `run:` — interpolados, el valor
      # del token entra en el texto del comando y cualquier `set -x`, traza de
      # error o `ps` del runner lo expone; el enmascarado de Actions sólo cubre la
      # salida de los logs.
      - name: Verify Supabase secrets are set
        run: |
          missing=""
          if [ -z "${ACCESS_TOKEN:-}" ]; then missing="$missing SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "${PROJECT_ID:-}" ];   then missing="$missing SUPABASE_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de GitHub:$missing"
            echo "Si el repositorio los restringió al Environment 'production-db',"
            echo "cárgalos ahí: Settings → Environments → production-db → Secrets."
            echo "Si son secrets de repositorio: Settings → Secrets and variables → Actions."
            echo "SUPABASE_ACCESS_TOKEN: Account → Access Tokens (Management API)."
            echo "SUPABASE_PROJECT_ID: ref del proyecto (Project Settings → General)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Cortafuegos append-only ANTES de seleccionar nada: el paso `list` de
      # abajo selecciona con --diff-filter=AM, así que una migración histórica
      # MODIFICADA en el push se reaplicaría contra producción tal cual (la
      # clase del incidente 2026-08-03). Si el push tocó el histórico
      # (modificar/eliminar/renombrar), se aborta aquí sin ejecutar SQL.
      # FAIL-CLOSED: si `before` no es alcanzable (force-push a main), también
      # aborta — sin rango verificable no se valida nada; un force-push puede
      # reescribir históricas en commits anteriores al último y el diff de un
      # solo commit no las vería. Recuperación: revisar el histórico a mano y
      # aplicar lo pendiente con workflow_dispatch (modo reconciliar).
      # Solo aplica a push: workflow_dispatch no trae rango y el modo
      # reconciliar re-aplica pendientes por diseño.
      - name: Migrations append-only (histórico inmutable)
        if: github.event_name == 'push'
        run: node scripts/migrations-append-only.mjs --base "$PUSH_BEFORE" --head "$PUSH_AFTER"

      - name: Build list of migrations to apply
        id: list
        run: |
          set -uo pipefail
          MIG_DIR="supabase/migrations"
          files=""

          remote_versions () {
            # Versiones ya registradas en el historial remoto (una por línea).
            #
            # Falla RUIDOSA a propósito. Antes acababa en `|| true`, así que una
            # llamada fallida (token muerto, red) devolvía una lista VACÍA
            # indistinguible de "no hay ninguna aplicada" — y el reconciliador de
            # abajo habría intentado reaplicar TODAS las migraciones del repo desde
            # cero contra producción. Mismo patrón que el bug del apply: no mirar
            # el resultado de la llamada.
            local code resp
            code=$(curl -s -o /tmp/hist-resp.json -w "%{http_code}" -X POST "$API_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"select version from supabase_migrations.schema_migrations order by version"}')
            resp=$(cat /tmp/hist-resp.json)
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ] || ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$resp"; then
              echo "::error::No se pudo leer el historial remoto (HTTP $code): $(head -c 300 /tmp/hist-resp.json)" >&2
              return 1
            fi
            jq -r '.[].version' <<<"$resp"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_FILE:-}" ]; then
            # El dispatch con archivo explícito era la ÚNICA entrada sin filtro:
            # comprobaba `-f` y nada más. `-f` acepta cualquier ruta que resuelva
            # a un archivo, así que un `../..` sacaba la selección de
            # supabase/migrations y mandaba ese contenido al endpoint de
            # producción; y como el cortafuegos append-only sólo corre en `push`,
            # este camino podía además REAPLICAR una migración histórica — la
            # causa raíz del 2026-08-03.
            #
            # Ahora se exige historial remoto también aquí (misma llamada fallo-
            # ruidoso que usa el reconciliador) y se valida el nombre + la versión
            # con un script probado (scripts/__tests__/validar-migration-dispatch).
            if ! applied=$(remote_versions); then
              echo "::error::Abortado antes de tocar producción: sin el historial remoto no se puede saber si $INPUT_FILE ya está aplicada, y reaplicar una histórica es exactamente el incidente 2026-08-03."
              exit 1
            fi
            printf '%s\n' "$applied" > /tmp/applied-versions.txt
            if ! node scripts/validar-migration-dispatch.mjs \
                   --file "$INPUT_FILE" --dir "$MIG_DIR" --aplicadas /tmp/applied-versions.txt; then
              exit 1
            fi
            files="$MIG_DIR/$INPUT_FILE"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Reconciliar: locales cuya versión NO esté en el historial remoto.
            # Sin historial fiable NO se reconcilia: ver remote_versions.
            if ! applied=$(remote_versions); then
              echo "::error::Abortado antes de tocar producción: sin el historial remoto no se puede saber qué falta, y asumir 'nada aplicado' reaplicaría todo."
              exit 1
            fi
            for f in $(ls "$MIG_DIR"/*.sql 2>/dev/null | sort); do
              base=$(basename "$f" .sql); ver=${base%%_*}
              if ! grep -qxF "$ver" <<<"$applied"; then files="$files $f"; fi
            done
          else
            # push a main: solo los .sql añadidos/modificados en este push.
            #
            # `--no-renames` NO es opcional. Git detecta un archivo renombrado
            # como una sola entrada `R`, y `--diff-filter=AM` excluye la R: el
            # archivo desaparece de la lista y el job reporta "Nothing to apply"
            # en VERDE, sin aplicar ni registrar nada. Con --no-renames el
            # renombre se descompone en D + A, y la A sí entra por el filtro.
            #
            # Pasó en el merge de #681: los dos renombres de migración
            # (…100000 → …100001, …110000 → …110001) se saltaron en silencio.
            # No rompió nada porque su DDL ya estaba aplicado, pero el registro
            # quedó incompleto y el fallo fue INVISIBLE — el peor modo posible
            # para un workflow que toca producción.
            #
            # Y el caso se va a repetir: la regla (d) de migrations-guard.mjs
            # manda RENOMBRAR el archivo cuando hay timestamp duplicado. Sin
            # esto, seguir esa instrucción mete la migración en este agujero.
            range=""
            if [ -n "${PUSH_BEFORE:-}" ] \
               && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE $PUSH_AFTER"
            fi
            if [ -n "$range" ]; then
              changed=$(git diff --name-only --no-renames --diff-filter=AM $range -- "$MIG_DIR" | grep '\.sql$' || true)
            else
              changed=$(git show --name-only --no-renames --diff-filter=AM --pretty=format: "$PUSH_AFTER" -- "$MIG_DIR" | grep '\.sql$' || true)
            fi
            files="$changed"
          fi

          files=$(printf '%s\n' $files | sed '/^$/d' | sort -u | tr '\n' ' ')
          echo "Migraciones a aplicar: ${files:-(ninguna)}"

          # ── Tope duro ─────────────────────────────────────────────────────
          #
          # Un despliegue sano nunca trae decenas de migraciones pendientes. Si
          # la selección se dispara, NO es un despliegue grande: es que algo se
          # descuadró, y lo correcto es parar y avisar en vez de reescribir
          # producción a ciegas.
          #
          # El 2026-08-03 faltaba esto. `schema_migrations` estaba incompleto
          # (solo registraba lo posterior al 2026-06-05), el reconciliador dio
          # por pendientes 257 migraciones YA aplicadas y las reejecutó. Una de
          # ellas, `20260320000000_fix_superadmin_app_users_uuid`, empieza con
          # `DROP TABLE IF EXISTS public.app_users CASCADE`: se llevó por delante
          # todos los perfiles, nadie pudo entrar y hubo que restaurar el backup
          # de las 06:22 UTC perdiendo la mañana entera.
          #
          # cleanup-preview-branches ya tenía esta idea con MAX_DELETIONS, y su
          # comentario la explica: "si algún día la API devolviera basura, el
          # daño queda acotado y visible en vez de barrer el proyecto entero".
          # Estaba en el workflow que borra ramas de preview y no en el que
          # escribe en la base de producción.
          #
          # Si el tope salta de forma legítima (un backlog real tras semanas sin
          # desplegar), se aplica por lotes con `migration_file`, revisando cada
          # una. Nunca subir el número para "que pase".
          count=$(printf '%s\n' $files | sed '/^$/d' | wc -l)
          if [ "$count" -gt "$MAX_APPLY" ]; then
            {
              echo "### ⛔ Abortado: $count migraciones pendientes (tope: $MAX_APPLY)"
              echo ""
              echo "Un despliegue normal no trae tantas. Antes de tocar producción, revisar"
              echo "si \`supabase_migrations.schema_migrations\` está completo — si le faltan"
              echo "versiones ya aplicadas, esto reejecutaría migraciones antiguas contra la"
              echo "base. Ver \`scripts/backfill-schema-migrations.sql\`."
              echo ""
              echo "Seleccionadas:"
              printf '%s\n' $files | sed '/^$/d' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$count migraciones pendientes supera el tope de $MAX_APPLY — abortado sin tocar producción. Revisar el historial en schema_migrations (scripts/backfill-schema-migrations.sql)."
            exit 1
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Apply migrations via Management API
        if: steps.list.outputs.files != ''
        env:
          FILES: ${{ steps.list.outputs.files }}
        run: |
          set -uo pipefail
          fail=0
          detenida=""
          {
            echo "### Aplicación de migraciones a producción"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in $FILES; do
            base=$(basename "$f" .sql); ver=${base%%_*}; name=${base#*_}
            echo "::group::Aplicando $base"
            sql=$(cat "$f")
            payload=$(jq -Rs '{query: .}' <<<"$sql")
            # El código HTTP se MIRA. Antes solo se buscaba `.error` en el cuerpo,
            # y eso dejó pasar el fallo peor posible: el 2026-08-03 las tres
            # migraciones de #698 respondieron `{"message":"Unauthorized"}` con el
            # token caducado, `jq -e '.error'` dio falso porque la clave es
            # `message` y no `error`, y el job imprimió "Todas las migraciones se
            # aplicaron correctamente" EN VERDE sin haber ejecutado una sola línea
            # de SQL contra producción. Un 403, un 404 o una página de error 500
            # habrían pasado igual.
            #
            # El criterio ahora es positivo, no una lista de formas de error: una
            # consulta que salió bien devuelve 2xx Y un array de filas (vacío para
            # DDL). Cualquier otra cosa es un fallo, se llame como se llame.
            code=$(curl -s -o /tmp/apply-resp.json -w "%{http_code}" -X POST "$API_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload")
            resp=$(cat /tmp/apply-resp.json)
            echo "HTTP $code"
            echo "$resp"
            motivo=""
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              motivo="HTTP $code"
              [ "$code" = "401" ] && motivo="HTTP 401 — SUPABASE_ACCESS_TOKEN inválido, expirado o revocado"
              [ "$code" = "403" ] && motivo="HTTP 403 — el token no tiene permiso sobre el proyecto"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$resp"; then
              motivo="respuesta inesperada (se esperaba un array de filas)"
            fi
            # FAIL-FAST. Antes esto era `continue`, y el 2026-08-27 costó caro: al
            # fallar 20260904000100 (le faltaba una columna en el esquema real de
            # producción), el bucle siguió y aplicó 000200 y 000300 encima. Producción
            # quedó en un estado que NINGUNA migración describe —dos aplicadas y
            # registradas, una revertida, una que ni podía correr— y el frontend
            # desplegado en ese mismo push contaba con las cuatro.
            #
            # Una serie de migraciones es una secuencia, no un lote independiente: la
            # N+1 suele dar por hecho lo que hizo la N. Aplicar la siguiente después de
            # un fallo no adelanta trabajo, sólo produce un estado híbrido más difícil
            # de razonar que el fallo original. Se corta aquí y las que faltan se
            # declaran no intentadas en el resumen.
            if [ -n "$motivo" ]; then
              echo "::error::Falló $base — $motivo: $(head -c 300 /tmp/apply-resp.json)"
              echo "- ❌ \`$base\` — $motivo" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              detenida="$base"
              parada="apply"
              echo "::endgroup::"
              break
            fi
            # Registrar en el historial (idempotente con ON CONFLICT). FAIL-CLOSED,
            # ya NO best-effort.
            #
            # Esto era un `::warning::` + `continue`, con el cuerpo a /dev/null y
            # mirando sólo el código HTTP. Tres fallos en uno: el DDL quedaba
            # aplicado pero SIN registrar, el bucle seguía con la siguiente, y el
            # job terminaba imprimiendo "Todas las migraciones se aplicaron
            # correctamente" EN VERDE. Un historial incompleto no es cosmético: es
            # justo la entrada del modo reconciliar, que vuelve a ver esa migración
            # como pendiente y la REAPLICA. Es la mecánica del 2026-08-03, cuando
            # reaplicar migraciones ya aplicadas ejecutó un DROP TABLE ... CASCADE
            # sobre app_users y hubo que restaurar el backup.
            #
            # El criterio es el mismo POSITIVO que el del apply: 2xx Y un array de
            # filas. El cuerpo NO va a /dev/null — sin leerlo no se distingue un
            # 200 con un error dentro de un 200 de verdad, ni se puede dar
            # diagnóstico al operador.
            hist="insert into supabase_migrations.schema_migrations (version, name) values ('$ver', '$name') on conflict (version) do nothing;"
            hist_code=$(curl -s -o /tmp/hist-resp.json -w "%{http_code}" -X POST "$API_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -Rs '{query: .}' <<<"$hist")")
            hist_resp=$(cat /tmp/hist-resp.json 2>/dev/null || true)
            hist_motivo=""
            if [ "$hist_code" -lt 200 ] || [ "$hist_code" -ge 300 ]; then
              hist_motivo="HTTP $hist_code"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$hist_resp"; then
              hist_motivo="HTTP $hist_code con cuerpo inesperado (se esperaba un array de filas)"
            fi
            if [ -n "$hist_motivo" ]; then
              echo "::error::$base SE APLICÓ pero NO se pudo registrar en schema_migrations — $hist_motivo: $(head -c 300 /tmp/hist-resp.json 2>/dev/null)"
              echo "- ⛔ \`$base\` — **DDL aplicado pero SIN registrar** ($hist_motivo)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              detenida="$base"
              parada="registro"
              echo "::endgroup::"
              break
            fi
            echo "- ✅ \`$base\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

          # Las posteriores a la que falló NO se intentaron: decirlo es la mitad del
          # valor del corte. Un resumen que sólo muestre la fallida se lee como si el
          # resto hubiera pasado.
          if [ -n "${detenida:-}" ]; then
            visto=0
            for f in $FILES; do
              b=$(basename "$f" .sql)
              if [ "$visto" = "1" ]; then
                echo "- ⏭️ \`$b\` — no intentada (se detuvo en \`$detenida\`)" >> "$GITHUB_STEP_SUMMARY"
              fi
              [ "$b" = "$detenida" ] && visto=1
            done
            if [ "${parada:-apply}" = "registro" ]; then
              # El DDL de $detenida SÍ corrió: reintentar a ciegas la reaplicaría.
              {
                echo ""
                echo "> ⛔ **\`$detenida\` quedó aplicada en la base pero NO registrada en"
                echo "> \`supabase_migrations.schema_migrations\`.** El DDL puede haberse ejecutado"
                echo "> entero; el historial es el que quedó incompleto."
                echo ">"
                echo "> **No volver a disparar sin antes reparar/verificar el historial.** Con la"
                echo "> versión sin registrar, el modo reconciliar la da por pendiente y la REAPLICA:"
                echo "> es la mecánica del incidente 2026-08-03. Comprobar en la base si el DDL"
                echo "> está puesto y registrar la versión a mano (o con"
                echo "> \`scripts/backfill-schema-migrations.sql\`) ANTES de reintentar."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$detenida se aplicó pero NO se registró en schema_migrations. El DDL puede estar puesto: verificar la base y reparar el historial ANTES de reintentar — reaplicarla es el incidente 2026-08-03. Las posteriores no se intentaron."
            else
              echo "::error::Se detuvo en $detenida sin intentar las posteriores. Corregir el prerrequisito y volver a disparar."
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Una o más migraciones fallaron. Revisá el log."
            exit 1
          fi
          echo "Todas las migraciones se aplicaron correctamente."

      - name: Nothing to apply
        if: steps.list.outputs.files == ''
        run: |
          # En `push` este workflow SOLO se dispara si cambió supabase/migrations/**
          # (ver `paths`). Que la selección quede vacía significa entonces que un
          # cambio de migración se coló sin aplicarse — exactamente el fallo mudo
          # de #681. Un verde silencioso ahí no es "no había nada que hacer".
          if [ "$EVENT_NAME" = "push" ]; then
            echo "::warning::El push tocó supabase/migrations/** pero no se seleccionó ningún .sql."
            echo "::warning::Revisá si fue un borrado puro; si no, la migración NO se aplicó."
