name: Edge Function Tests

# Gate de CI para los tests de las edge functions (infra:I22 · Track T8, épicas #307/#321).
#
# Contexto: las edge functions viven en supabase/functions/ (Deno). Sus tests, sin
# embargo, están escritos para **vitest** (igual que _shared/__tests__/*.test.ts y
# signup-company/__tests__): importan `vitest` y tratan los módulos .ts como TS normal,
# stubeando `Deno.env` / mockeando el cliente de supabase-js. Por eso el gate REAL corre
# vitest acotado a supabase/functions/ (no `deno test`, que no resolvería `vitest`).
#
# Además, un job ADVISORY corre `deno check` sobre los helpers puros extraídos para
# detectar drift de tipos a nivel Deno (lo que `tsc` no cubre: tsconfig solo incluye src/).
#
# Es aditivo: el workflow `ci.yml` ya corre `npm run test` (toda la suite, incl. estos
# tests). Este workflow los aísla para feedback rápido y específico cuando solo cambian
# edge functions, y deja el typecheck Deno como red de seguridad.

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-tests.yml'
  workflow_dispatch:

# Cancela corridas superadas en el mismo ref para ahorrar minutos.
concurrency:
  group: edge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos del GITHUB_TOKEN (auditoría 2026-07-28, PR-20). Sin bloque
# `permissions` se heredan los del repositorio, que por defecto pueden ser de
# escritura: un step comprometido (o una dependencia que ejecute código en
# postinstall) podría entonces empujar commits o publicar releases. Ninguno de
# estos workflows escribe en el repo.
permissions:
  contents: read

jobs:
  vitest-edge:
    name: vitest — supabase/functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Corre SOLO los tests bajo supabase/functions/ (vitest acepta rutas como filtro).
      # `--dir` acota el descubrimiento para no levantar la suite de src/ aquí.
      - name: Run edge function tests
        run: npx vitest run --dir supabase/functions

  deno-check:
    name: deno check — helpers puros (bloqueante)
    runs-on: ubuntu-latest
    # PR-30 (auditoría 2026-07-28). Antes: advisory (`continue-on-error: true`) y
    # con una lista de 5 archivos escrita a mano.
    #
    # POR QUÉ IMPORTA: `tsconfig.json` tiene `include: ["src"]`, así que
    # `npm run type-check` NO MIRA NADA de supabase/functions. Toda la ruta de
    # dinero del servidor —los proveedores de pago y fiscales, el cálculo de
    # comisión y recargo, la conciliación— no tenía typecheck de ninguna clase.
    # Deno sí resuelve los imports `https://`, así que es la herramienta correcta.
    #
    # Se pasa a BLOQUEANTE y la lista se genera SOLA: se typechequea todo `.ts`
    # de supabase/functions que no importe supabase-js ni el SDK de Stripe. Esos
    # son los únicos que dan falsos positivos —usan el cliente sin tipos
    # generados, así que `.from().select()` infiere `never` y va casteado con
    # `as`—; el resto es lógica pura y su chequeo es real.
    #
    # Generar la lista en vez de fijarla es deliberado: la lista de 5 escrita a
    # mano se quedó cubriendo el 12% de los helpers puros sin que nadie lo notara.
    # Así, un helper nuevo entra al gate el día que se escribe.
    #
    # POR QUÉ NO HAY UN JOB EQUIVALENTE PARA LOS HANDLERS (index.ts):
    # Se probó en este mismo PR y devolvió 91 errores, TODOS ruido del entorno de
    # tipos, ninguno un defecto: `SupabaseClient<any,…>` no asignable a
    # `SupabaseClient<unknown,…>`, `.update({…})` contra `never` (el cliente sin
    # tipos generados), y un `file instanceof File` que depende de las libs DOM
    # que cargue Deno. Un check "advisory" permanentemente rojo es PEOR que no
    # tenerlo: normaliza el rojo en los PRs y entrena a ignorarlo. Para que los
    # handlers sean verificables hay que generar antes los tipos de la BD para el
    # lado Deno (`supabase gen types` + un import_map); hasta entonces, el gate
    # honesto es este, sobre lógica pura.
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: deno check (helpers puros, lista generada)
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            find supabase/functions -name '*.ts' \
              ! -path '*__tests__*' \
              ! -name 'index.ts' \
              -print0 \
            | xargs -0 grep -LE "^[[:space:]]*import.*(supabase-js|esm\.sh/stripe)" \
            | sort
          )
          echo "Helpers puros a verificar: ${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          deno check "${FILES[@]}"
