name: Edge Function Tests

# Gate de CI para los tests de las edge functions (infra:I22 · Track T8, épicas #307/#321).
#
# Contexto: las edge functions viven en supabase/functions/ (Deno). Sus tests, sin
# embargo, están escritos para **vitest** (igual que _shared/__tests__/*.test.ts y
# signup-company/__tests__): importan `vitest` y tratan los módulos .ts como TS normal,
# stubeando `Deno.env` / mockeando el cliente de supabase-js. Por eso el gate REAL corre
# vitest acotado a supabase/functions/ (no `deno test`, que no resolvería `vitest`).
#
# Además, un job ADVISORY corre `deno check` sobre los helpers puros extraídos para
# detectar drift de tipos a nivel Deno (lo que `tsc` no cubre: tsconfig solo incluye src/).
#
# Es aditivo: el workflow `ci.yml` ya corre `npm run test` (toda la suite, incl. estos
# tests). Este workflow los aísla para feedback rápido y específico cuando solo cambian
# edge functions, y deja el typecheck Deno como red de seguridad.

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-tests.yml'
  workflow_dispatch:

# Cancela corridas superadas en el mismo ref para ahorrar minutos.
concurrency:
  group: edge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-edge:
    name: vitest — supabase/functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Corre SOLO los tests bajo supabase/functions/ (vitest acepta rutas como filtro).
      # `--dir` acota el descubrimiento para no levantar la suite de src/ aquí.
      - name: Run edge function tests
        run: npx vitest run --dir supabase/functions

  deno-check:
    name: deno check (advisory)
    runs-on: ubuntu-latest
    # Advisory: los tests usan vitest, así que NO corremos `deno test`. Aquí
    # typecheckeamos con Deno SOLO los helpers puros extraídos (render.ts /
    # validate.ts), que NO importan supabase-js. Los handlers (index.ts) usan el
    # cliente Supabase sin tipos generados (`.from().select()` infiere `never`,
    # casteado con `as`): `deno check` sobre ellos da falsos positivos de tipo, no
    # bugs reales. Apuntando a los helpers, el chequeo caza drift de tipos REAL en
    # la lógica pura. Se mantiene continue-on-error como red de seguridad.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Typecheck Deno de los helpers puros (sin I/O ni supabase-js). Detecta drift
      # de tipos que `tsc` no ve (tsconfig solo incluye src/). Los globs cubren la
      # convención logic.ts/validate.ts por función (I22 lote 2: billing, pagos,
      # auth/lifecycle, correo/OAuth, crons/fiscal); el shell los expande, así que
      # cada helper nuevo que siga la convención entra solo.
      - name: deno check pure helpers
        run: |
          deno check \
            supabase/functions/notifications-dispatcher/render.ts \
            supabase/functions/_shared/uploadValidation.ts \
            supabase/functions/*/logic.ts \
            supabase/functions/*/validate.ts
