name: Edge Function Tests

# Gate de CI para los tests de las edge functions (infra:I22 · Track T8, épicas #307/#321).
#
# Contexto: las edge functions viven en supabase/functions/ (Deno). Sus tests, sin
# embargo, están escritos para **vitest** (igual que _shared/__tests__/*.test.ts y
# signup-company/__tests__): importan `vitest` y tratan los módulos .ts como TS normal,
# stubeando `Deno.env` / mockeando el cliente de supabase-js. Por eso el gate REAL corre
# vitest acotado a supabase/functions/ (no `deno test`, que no resolvería `vitest`).
#
# Además, dos jobs BLOQUEANTES corren `deno check` (lo que `tsc` no cubre: tsconfig
# solo incluye src/, y eslint ignora supabase/**): uno sobre los helpers puros y otro
# sobre los handlers (`*/index.ts`) con todo lo que importan.
#
# Es aditivo: el workflow `ci.yml` ya corre `npm run test` (toda la suite, incl. estos
# tests). Este workflow los aísla para feedback rápido y específico cuando solo cambian
# edge functions, y deja el typecheck Deno como red de seguridad.

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/deno/**'
      - '.github/workflows/edge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/deno/**'
      - '.github/workflows/edge-tests.yml'
  workflow_dispatch:

# Cancela corridas superadas en el mismo ref para ahorrar minutos.
concurrency:
  group: edge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos del GITHUB_TOKEN (auditoría 2026-07-28, PR-20). Sin bloque
# `permissions` se heredan los del repositorio, que por defecto pueden ser de
# escritura: un step comprometido (o una dependencia que ejecute código en
# postinstall) podría entonces empujar commits o publicar releases. Ninguno de
# estos workflows escribe en el repo.
permissions:
  contents: read

jobs:
  vitest-edge:
    name: vitest — supabase/functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Corre SOLO los tests bajo supabase/functions/ (vitest acepta rutas como filtro).
      # `--dir` acota el descubrimiento para no levantar la suite de src/ aquí.
      - name: Run edge function tests
        run: npx vitest run --dir supabase/functions

  deno-check:
    name: deno check — helpers puros (bloqueante)
    runs-on: ubuntu-latest
    # PR-30 (auditoría 2026-07-28). Antes: advisory (`continue-on-error: true`) y
    # con una lista de 5 archivos escrita a mano.
    #
    # POR QUÉ IMPORTA: `tsconfig.json` tiene `include: ["src"]`, así que
    # `npm run type-check` NO MIRA NADA de supabase/functions. Toda la ruta de
    # dinero del servidor —los proveedores de pago y fiscales, el cálculo de
    # comisión y recargo, la conciliación— no tenía typecheck de ninguna clase.
    # Deno sí resuelve los imports `https://`, así que es la herramienta correcta.
    #
    # Se pasa a BLOQUEANTE y la lista se genera SOLA: se typechequea todo `.ts`
    # de supabase/functions que no importe supabase-js ni el SDK de Stripe. Esos
    # son los únicos que dan falsos positivos —usan el cliente sin tipos
    # generados, así que `.from().select()` infiere `never` y va casteado con
    # `as`—; el resto es lógica pura y su chequeo es real.
    #
    # Generar la lista en vez de fijarla es deliberado: la lista de 5 escrita a
    # mano se quedó cubriendo el 12% de los helpers puros sin que nadie lo notara.
    # Así, un helper nuevo entra al gate el día que se escribe.
    #
    # Los handlers (index.ts) y lo que importa supabase-js/Stripe los cubre el
    # job `deno-check-handlers`, más abajo.
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: deno check (helpers puros, lista generada)
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            find supabase/functions -name '*.ts' \
              ! -path '*__tests__*' \
              ! -name 'index.ts' \
              -print0 \
            | xargs -0 grep -LE "^[[:space:]]*import.*(supabase-js|esm\.sh/stripe)" \
            | sort
          )
          echo "Helpers puros a verificar: ${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          deno check "${FILES[@]}"

  deno-check-handlers:
    name: deno check — handlers index.ts (bloqueante)
    runs-on: ubuntu-latest
    # POR QUÉ EXISTE: `delete-company` respondió 500 a TODA petición desde
    # 6db61ad1 (#672) hasta #931 por llamar a `getAllowedOrigins()`, que no
    # existía en el módulo (ReferenceError fuera del try). Ningún gate lo vio: el
    # job de arriba excluye todo `index.ts`, `tsconfig.json` sólo incluye src/ y
    # eslint ignora supabase/**. `deno check` lo reporta en el acto:
    # `TS2304 Cannot find name 'getAllowedOrigins'`.
    #
    # POR QUÉ AHORA SÍ ES VERIFICABLE: antes se probó y dio 91 errores de
    # "entorno". Casi todos eran tipos mal escritos en NUESTRO código, no ruido
    # irreducible: helpers tipados con `ReturnType<typeof createClient>` (cliente
    # sin esquema → `.update()` contra `never`; ahora `SupabaseClient`, como
    # `_shared/auth.ts`) y `RpcClient` exigiendo `Promise` cuando `.rpc()`
    # devuelve un builder que sólo es `PromiseLike`. Entre ellos había defectos
    # reales: `.catch()` sobre el builder de PostgREST (TypeError que abortaba
    # el rollback de signup-company y accept-invitation) y un `buildRawMessage`
    # local que chocaba con el importado (route-reminders).
    #
    # CÓMO:
    #   · `.github/deno/import_map.json` redirige cada URL de esm.sh a su paquete
    #     npm con versión EXACTA: tipos reproducibles (la URL `@2` de esm.sh
    #     flota) y sin depender de esm.sh en CI. Vive FUERA de
    #     supabase/functions/ a propósito: el CLI de Supabase toma un
    #     `import_map.json` o `deno.json` en supabase/functions/ como
    #     configuración global de las funciones, y esto NO debe cambiar lo que
    #     se despliega. Sólo afecta a este chequeo.
    #   · `.github/deno/deno.lock` fija también las dependencias transitivas
    #     (p. ej. `@types/node`, que el SDK de Stripe pide con `>=8.1.0`): sin él,
    #     una publicación ajena podría poner rojo este gate sin cambio nuestro.
    #   · `--no-remote`: si un handler importa una URL que no está en el mapa,
    #     falla aquí ("A remote specifier was requested … --no-remote") en vez de
    #     bajar los tipos de esm.sh en silencio. Arreglo: añadir la URL al mapa
    #     (con su `npm:` y versión exacta).
    #   · Cubre TODO `.ts` no-test de supabase/functions: cada uno es alcanzable
    #     desde algún `index.ts` (verificado con `deno info` al crear el job).
    #
    # Límite conocido: el SDK de Stripe declara sus tipos como módulo ambiente
    # (`declare module 'stripe'`) y bajo `npm:` Deno lo deja en `any`. Las
    # llamadas a Stripe no se verifican; los nombres sin definir, sí.
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: deno check (supabase/functions/*/index.ts)
        run: |
          set -euo pipefail
          HANDLERS=(supabase/functions/*/index.ts)
          echo "Handlers a verificar: ${#HANDLERS[@]}"
          deno check --no-config --no-remote \
            --import-map=.github/deno/import_map.json \
            --lock=.github/deno/deno.lock \
            "${HANDLERS[@]}"

      # Segunda red, sin red ni npm: SÓLO la regla `no-undef` (`--rules-tags=`
      # vacío apaga el set recomendado, que sigue advisory en deploy-functions).
      # Detecta el mismo `getAllowedOrigins` aunque el typecheck no llegue a
      # correr, y cubre también los tests. Corre aunque el paso anterior falle.
      - name: deno lint — no-undef (supabase/functions)
        if: ${{ !cancelled() }}
        run: deno lint --rules-tags= --rules-include=no-undef supabase/functions
