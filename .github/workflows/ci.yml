name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Guardarraíl de arquitectura (P0 #11): los componentes no importan el
      # cliente `supabase` directo. Bloqueante — evita la regresión del boundary.
      - name: Lint (boundary)
        run: npm run lint

      - name: Test
        run: npm run test

      # Coverage en step separado y advisory: la instrumentación de v8 altera
      # el timing de tests sensibles a timers. El gate sigue siendo `Test`;
      # este paso solo recopila métricas para el dashboard de calidad.
      - name: Coverage (advisory)
        if: always()
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build
        run: npm run build
