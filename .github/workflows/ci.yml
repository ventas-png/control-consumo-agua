name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos del GITHUB_TOKEN (auditoría 2026-07-28, PR-20). Sin bloque
# `permissions` se heredan los del repositorio, que por defecto pueden ser de
# escritura: un step comprometido (o una dependencia que ejecute código en
# postinstall) podría entonces empujar commits o publicar releases. Ninguno de
# estos workflows escribe en el repo.
permissions:
  contents: read

jobs:
  quality:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: el guard append-only de migraciones compara
          # contra el merge-base con la rama base (PR) o contra `before` (push);
          # con el checkout superficial por defecto ninguno de los dos existe.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Guardarraíl de aislamiento multi-tenant (auditoría 2026-07-28, PR-9).
      # Análisis ESTÁTICO del repo, complementario a security-guard.yml (que mira
      # el catálogo de PROD, de noche, DESPUÉS del merge). Éste mira el repo, en
      # el PR, ANTES del merge — que es donde se cuela el drift: RLS habilitada a
      # mano en el dashboard deja prod verde para siempre mientras el repo se
      # queda sin la migración, y cualquier deploy fresco nace con el hueco.
      # Sin dependencias ni red: solo APIs nativas de Node, así que va antes de
      # `npm ci` para dar feedback en segundos.
      - name: Migrations guard (RLS + scope de RPCs)
        run: node scripts/migrations-guard.mjs

      # Las migraciones ya mergeadas son INMUTABLES: prod y las preview branches
      # ya las aplicaron, y el apply de push reaplicaría una modificada contra
      # producción (--diff-filter=AM). Este guard compara el diff Git del PR
      # (merge-base) o del push (before..HEAD) y solo permite AÑADIR archivos.
      # También nativo de Node y sin dependencias: va antes de `npm ci`.
      - name: Migrations append-only (histórico inmutable)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/migrations-append-only.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Guardarraíl de arquitectura (P0 #11): los componentes no importan el
      # cliente `supabase` directo. Bloqueante — evita la regresión del boundary.
      - name: Lint (boundary)
        run: npm run lint

      - name: Test
        run: npm run test

      # Coverage en step separado y advisory: la instrumentación de v8 altera
      # el timing de tests sensibles a timers. El gate sigue siendo `Test`;
      # este paso solo recopila métricas para el dashboard de calidad.
      - name: Coverage (advisory)
        if: always()
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build
        run: npm run build
