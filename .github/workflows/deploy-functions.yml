name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      migraciones_ya_aplicadas:
        description: 'Sólo para redesplegar un commit ANTIGUO cuyas migraciones ya están en producción. Salta la compuerta; queda registrado en el resumen.'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'

# Dos despliegues simultáneos de las mismas funciones se pisan: el segundo puede
# publicar un bundle más viejo encima del primero. Se encolan, no se cancelan —
# cancelar a medias dejaría la mitad de las funciones en una versión y la otra
# mitad en otra.
concurrency:
  group: deploy-functions-prod
  cancel-in-progress: false

# Permisos mínimos del GITHUB_TOKEN (auditoría 2026-07-28, PR-20). Sin bloque
# `permissions` se heredan los del repositorio, que por defecto pueden ser de
# escritura: un step comprometido (o una dependencia que ejecute código en
# postinstall) podría entonces empujar commits o publicar releases. Ninguno de
# estos workflows escribe en el repo.
permissions:
  contents: read
  # La compuerta de migraciones consulta el estado de las corridas de
  # `apply-migrations-prod.yml` para ESTE commit. Sólo lectura.
  actions: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ]   && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

  # Lint y formato de las edge functions. Modo advisory (no bloquea el deploy)
  # mientras estabilizamos la baseline. Una vez la base esté limpia, quitar
  # `continue-on-error` para hacerlo enforce.
  lint-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: deno fmt --check
        run: deno fmt --check supabase/functions/
        continue-on-error: true

      - name: deno lint
        run: deno lint supabase/functions/
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════════
  # COMPUERTA: las migraciones de ESTE commit, antes que las funciones.
  # ══════════════════════════════════════════════════════════════════════════
  # `apply-migrations-prod.yml` y este workflow se disparan los dos con el push
  # a `main`, por `paths` distintos y sin relación entre sí: GitHub los arranca
  # EN PARALELO. Para un commit que cambia las dos cosas, el orden lo decide el
  # azar — y a veces ni eso:
  #
  #   · `20260902000000` hace DROP de `paquete_reclamar_aviso(uuid, integer)` y
  #     `paquete_finalizar_aviso(uuid, boolean)`, y crea las de TRES argumentos.
  #   · La `notify-package` de ese mismo commit llama a las de tres argumentos.
  #
  #   Función primero → llama a una firma que aún no existe y todo aviso falla.
  #   Y si el Environment `production-db` pide aprobación humana, no hay carrera
  #   que valga: la función sale en dos minutos y el SQL espera a que alguien
  #   apruebe. La ventana de rotura no se mide en segundos.
  #
  # La compuerta espera al ESTADO REAL de esa corrida, nunca al reloj: sale en
  # cuanto concluye, y si vence el plazo ABORTA el despliegue en vez de
  # autorizarlo. La lógica vive en Node —no inline en el YAML— para poder
  # probarla: `scripts/__tests__/esperar-migraciones.test.mjs`.
  esperar-migraciones:
    runs-on: ubuntu-latest
    outputs:
      requiere: ${{ steps.diff.outputs.requiere }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ¿Este commit toca supabase/migrations/**?
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          OMITIR: ${{ github.event.inputs.migraciones_ya_aplicadas }}
        run: |
          set -uo pipefail

          # Override manual y explícito, sólo por workflow_dispatch. Existe para
          # redesplegar un commit viejo cuyas migraciones llevan meses en
          # producción; no es un atajo para saltarse la compuerta en un push.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${OMITIR:-false}" = "true" ]; then
            echo "::warning::Compuerta OMITIDA a mano (migraciones_ya_aplicadas=true). Quien lo lanzó afirma que las migraciones de este commit ya están aplicadas."
            echo "### ⚠️ Compuerta de migraciones omitida a mano" >> "$GITHUB_STEP_SUMMARY"
            echo "requiere=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # FAIL-CLOSED en todo lo que no sea un push con rango verificable.
          # Un `before` inalcanzable (force-push a main) o un evento sin rango no
          # permiten afirmar que NO hay migraciones, y «no lo sé» tiene que caer
          # del lado de esperar. Mismo criterio que el cortafuegos append-only
          # de apply-migrations-prod.yml.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Evento $EVENT_NAME: sin rango que mirar, se asume que hay migraciones (fail-closed)."
            echo "requiere=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PUSH_BEFORE:-}" ] \
             || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::El rango del push no es verificable; se asume que hay migraciones (fail-closed)."
            echo "requiere=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--no-renames` por la misma razón que en apply-migrations-prod: un
          # renombre aparece como una sola entrada R y se escaparía del filtro,
          # haciendo creer que no hay migraciones cuando sí las hay.
          cambios=$(git diff --name-only --no-renames "$PUSH_BEFORE" "$PUSH_AFTER" -- 'supabase/migrations' | grep '\.sql$' || true)
          if [ -n "$cambios" ]; then
            echo "Este commit toca migraciones:"; printf '  %s\n' $cambios
            echo "requiere=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios en supabase/migrations/**: no hay nada que esperar."
            echo "requiere=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar a que las migraciones de este commit terminen bien
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIERE_MIGRACIONES: ${{ steps.diff.outputs.requiere }}
          WORKFLOW_MIGRACIONES: apply-migrations-prod.yml
          # Sólo cuenta la corrida del PUSH. Un `workflow_dispatch` con
          # `migration_file` aplica UN archivo y termina en success, y eso no
          # acredita que estén todas las de este commit.
          EVENTO_ESPERADO: ${{ github.event_name == 'push' && 'push' || '' }}
          # Techo de espera, NO una espera fija: el paso sale en cuanto la
          # corrida concluye. Vencerlo ABORTA el despliegue; nunca lo autoriza.
          # Si la aprobación del Environment tarda más que esto, se aprueba y se
          # relanza este workflow.
          ESPERA_MAX_SEGUNDOS: '3600'
          INTERVALO_SEGUNDOS: '20'
        run: node scripts/esperar-migraciones.mjs

  deploy:
    needs: [check-secrets, lint-functions, esperar-migraciones]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # ───────────────────────────────────────────────────────────────────────
      # Convención (infra:I1, F2.2):
      #   --no-verify-jwt SOLO para funciones que tienen razón legítima:
      #     a) Endpoints pre-login (no hay JWT del usuario aún).
      #     b) Invocadas por triggers/cron con service_role (Supabase mete
      #        Authorization: Bearer <service_role_key>, no JWT del usuario).
      #     c) Endpoints públicos por diseño (health).
      #   El resto deben verificar JWT a nivel platform como defense in depth
      #   adicional a las verificaciones de rol que cada función hace en su
      #   código.
      # ───────────────────────────────────────────────────────────────────────

      - name: Deploy create-cliente-account (no JWT — onboarding pre-login)
        run: bash .github/scripts/deploy-fn.sh create-cliente-account --no-verify-jwt

      - name: Deploy create-payment-intent
        run: bash .github/scripts/deploy-fn.sh create-payment-intent

      - name: Deploy create-user (JWT requerido — el código valida rol admin del caller)
        run: bash .github/scripts/deploy-fn.sh create-user

      - name: Deploy delete-user (JWT requerido — el código valida rol admin del caller)
        run: bash .github/scripts/deploy-fn.sh delete-user

      - name: Deploy save-payment-config
        run: bash .github/scripts/deploy-fn.sh save-payment-config

      - name: Deploy stripe-webhook-handler
        run: bash .github/scripts/deploy-fn.sh stripe-webhook-handler

      - name: Deploy test-stripe
        run: bash .github/scripts/deploy-fn.sh test-stripe

      - name: Deploy log-security-event (no JWT — pre-login eventos como failed_login_attempt)
        run: bash .github/scripts/deploy-fn.sh log-security-event --no-verify-jwt

      - name: Deploy complete-oauth-onboarding (no JWT — verifica access_token Google internamente)
        run: bash .github/scripts/deploy-fn.sh complete-oauth-onboarding --no-verify-jwt

      - name: Deploy google-oauth-initiate
        run: bash .github/scripts/deploy-fn.sh google-oauth-initiate

      - name: Deploy google-oauth-callback
        run: bash .github/scripts/deploy-fn.sh google-oauth-callback

      - name: Deploy send-email
        run: bash .github/scripts/deploy-fn.sh send-email

      - name: Deploy notify-package (no JWT — invocada por trigger Postgres con service_role)
        run: bash .github/scripts/deploy-fn.sh notify-package --no-verify-jwt

      - name: Deploy route-reminders (no JWT — invocada por pg_cron con service_role)
        run: bash .github/scripts/deploy-fn.sh route-reminders --no-verify-jwt

      - name: Deploy purgar-fotos-registros (no JWT — invocada por pg_cron con service_role)
        run: bash .github/scripts/deploy-fn.sh purgar-fotos-registros --no-verify-jwt

      - name: Deploy health (no JWT — endpoint público para monitoreo externo)
        run: bash .github/scripts/deploy-fn.sh health --no-verify-jwt

      - name: Deploy signup-company (no JWT — onboarding self-service público; valida origin + fuerza password + Supabase Auth email confirmation)
        run: bash .github/scripts/deploy-fn.sh signup-company --no-verify-jwt

      - name: Deploy create-checkout-session (JWT requerido — solo company_owner/admin de su company puede iniciar checkout)
        run: bash .github/scripts/deploy-fn.sh create-checkout-session

      - name: Deploy create-billing-portal-session (JWT requerido — solo company_owner/admin de su company)
        run: bash .github/scripts/deploy-fn.sh create-billing-portal-session

      - name: Deploy stripe-platform-webhook (no JWT — Stripe firma con HMAC SHA-256, validado contra STRIPE_PLATFORM_WEBHOOK_SECRET)
        run: bash .github/scripts/deploy-fn.sh stripe-platform-webhook --no-verify-jwt

      # ───────────────────────────────────────────────────────────────────────
      # Cobros pluggable (payfac): cada empresa/locación elige su payfac y conecta
      # credenciales. verify_jwt=false en config.toml — estas funciones validan el
      # token a mano (service_role interno O JWT de admin/owner/usuario del tenant)
      # y nunca exponen el secreto de la bóveda payfac_secrets.
      # ───────────────────────────────────────────────────────────────────────
      - name: Deploy create-charge (no JWT — valida token a mano, service_role o JWT del tenant)
        run: bash .github/scripts/deploy-fn.sh create-charge --no-verify-jwt

      - name: Deploy payfac-save-credentials (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh payfac-save-credentials --no-verify-jwt

      - name: Deploy payfac-test-connection (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh payfac-test-connection --no-verify-jwt

      # ───────────────────────────────────────────────────────────────────────
      # Fiscal FEL/CFDI (serv:S11): mismo patrón "elige tu PAC y conecta".
      # Faltaban en este workflow → daban 404 en producción (igual que payfac).
      # verify_jwt=false + validación manual del token.
      # ───────────────────────────────────────────────────────────────────────
      - name: Deploy timbrar-documento (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh timbrar-documento --no-verify-jwt

      - name: Deploy fiscal-save-credentials (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh fiscal-save-credentials --no-verify-jwt

      - name: Deploy fiscal-test-connection (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh fiscal-test-connection --no-verify-jwt

      # Validación server-side de uploads (infra:I13): magic-bytes + tamaño + saneo
      # de SVG; sube con el JWT del llamador (RLS impone el tenant). verify_jwt=false
      # → valida el JWT a mano via requireUser.
      - name: Deploy validate-upload (no JWT — valida JWT a mano; magic-bytes + tamaño + SVG)
        run: bash .github/scripts/deploy-fn.sh validate-upload --no-verify-jwt

      # SSO/SAML admin (plat:P10): admin de dominios + proveedor SAML por tenant.
      # Deriva company_id de la sesión, exige owner/admin; verify_jwt=false → valida
      # el token a mano (service_role o JWT admin/owner). Handshake real parqueado (#430).
      - name: Deploy sso-admin (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh sso-admin --no-verify-jwt

      # Motor de notificaciones (T2). El dispatcher lo invoca pg_cron cada minuto
      # (run_notifications_dispatcher → service_role); procesa el outbox, respeta
      # preferencias de canal (suppressed) y registra notification_events.
      # create-broadcast resuelve audiencia + fan-out, valida el JWT admin/owner a
      # mano. Ambos verify_jwt=false (control de acceso interno propio).
      - name: Deploy notifications-dispatcher (no JWT — invocada por pg_cron con service_role)
        run: bash .github/scripts/deploy-fn.sh notifications-dispatcher --no-verify-jwt

      - name: Deploy create-broadcast (no JWT — valida JWT admin/owner a mano)
        run: bash .github/scripts/deploy-fn.sh create-broadcast --no-verify-jwt

      # ── Funciones que faltaban en este workflow (auditoría 2026-07-28, PR-20) ──
      # Las 10 de abajo tienen index.ts y se invocan en producción, pero no estaban
      # aquí: su despliegue —y por tanto su postura `verify_jwt`— dependía de que
      # alguien corriera `supabase functions deploy` a mano. Eso es exactamente el
      # tipo de deriva que abre huecos sin que nadie lo note, porque el flag se
      # decide fuera del repo.
      #
      # Las 7 primeras declaran `verify_jwt = false` en config.toml y validan el
      # token por su cuenta; las 3 últimas ni siquiera están en config.toml y se
      # autentican con un secreto de cron o con el service-role key.

      # Alta por invitación: el invitado AÚN NO tiene sesión (llega desde el correo
      # con un token), así que no puede haber JWT. La función valida el token de
      # invitación contra la tabla.
      - name: Deploy accept-invitation (no JWT — el invitado aún no tiene sesión; valida el token de invitación)
        run: bash .github/scripts/deploy-fn.sh accept-invitation --no-verify-jwt

      - name: Deploy invite-user (no JWT — valida el JWT a mano; whitelist INVITABLE_ROLES)
        run: bash .github/scripts/deploy-fn.sh invite-user --no-verify-jwt

      - name: Deploy delete-company (no JWT — valida el JWT a mano; super_admin + confirmación por nombre exacto)
        run: bash .github/scripts/deploy-fn.sh delete-company --no-verify-jwt

      - name: Deploy confirm-charge (no JWT — valida token a mano; confirmación server-side del cobro)
        run: bash .github/scripts/deploy-fn.sh confirm-charge --no-verify-jwt

      - name: Deploy whatsapp-save-credentials (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh whatsapp-save-credentials --no-verify-jwt

      - name: Deploy whatsapp-test-connection (no JWT — valida token a mano, service_role o admin/owner)
        run: bash .github/scripts/deploy-fn.sh whatsapp-test-connection --no-verify-jwt

      - name: Deploy backfill-tenant-secrets (no JWT — cifrado en reposo; auth por CRON_SECRET/service_role en tiempo constante)
        run: bash .github/scripts/deploy-fn.sh backfill-tenant-secrets --no-verify-jwt

      # Push nativas de la app móvil. JWT requerido a nivel platform: la llaman el
      # backend con la service-role key y el propio usuario con su JWT, y ambas
      # pasan la verificación. Además valida el caller por su cuenta (solo interno
      # o el usuario sobre sí mismo). Sin FCM_SERVICE_ACCOUNT responde
      # not_configured, así que es seguro desplegarla antes de configurar Firebase.
      - name: Deploy send-push (JWT requerido — service-role del backend o JWT del propio usuario)
        run: bash .github/scripts/deploy-fn.sh send-push

      # Workers de cron: los invoca pg_cron/pg_net con un secreto propio, nunca el
      # navegador. verify_jwt debe ser false porque no llega ningún JWT de usuario.
      - name: Deploy process-email-queue (no JWT — worker de pg_cron; auth por CRON_SECRET en tiempo constante)
        run: bash .github/scripts/deploy-fn.sh process-email-queue --no-verify-jwt

      - name: Deploy process-scheduled-reports (no JWT — worker de pg_cron; auth por service-role key en tiempo constante)
        run: bash .github/scripts/deploy-fn.sh process-scheduled-reports --no-verify-jwt

      - name: Deploy sync-stripe-quantities (no JWT — worker de pg_cron; auth por CRON_SECRET en tiempo constante)
        run: bash .github/scripts/deploy-fn.sh sync-stripe-quantities --no-verify-jwt

      - name: Deploy track-email-open (no JWT — píxel público; autoriza el token HMAC firmado con CRON_SECRET)
        run: bash .github/scripts/deploy-fn.sh track-email-open --no-verify-jwt
