name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ]   && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

  # Lint y formato de las edge functions. Modo advisory (no bloquea el deploy)
  # mientras estabilizamos la baseline. Una vez la base esté limpia, quitar
  # `continue-on-error` para hacerlo enforce.
  lint-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: deno fmt --check
        run: deno fmt --check supabase/functions/
        continue-on-error: true

      - name: deno lint
        run: deno lint supabase/functions/
        continue-on-error: true

  deploy:
    needs: [check-secrets, lint-functions]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ───────────────────────────────────────────────────────────────────────
      # Convención (infra:I1, F2.2):
      #   --no-verify-jwt SOLO para funciones que tienen razón legítima:
      #     a) Endpoints pre-login (no hay JWT del usuario aún).
      #     b) Invocadas por triggers/cron con service_role (Supabase mete
      #        Authorization: Bearer <service_role_key>, no JWT del usuario).
      #     c) Endpoints públicos por diseño (health).
      #   El resto deben verificar JWT a nivel platform como defense in depth
      #   adicional a las verificaciones de rol que cada función hace en su
      #   código.
      # ───────────────────────────────────────────────────────────────────────

      - name: Deploy create-cliente-account (no JWT — onboarding pre-login)
        run: |
          supabase functions deploy create-cliente-account \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy create-payment-intent
        run: |
          supabase functions deploy create-payment-intent \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy create-user (JWT requerido — el código valida rol admin del caller)
        run: |
          supabase functions deploy create-user \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy delete-user (JWT requerido — el código valida rol admin del caller)
        run: |
          supabase functions deploy delete-user \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy save-payment-config
        run: |
          supabase functions deploy save-payment-config \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy stripe-webhook-handler
        run: |
          supabase functions deploy stripe-webhook-handler \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy test-stripe
        run: |
          supabase functions deploy test-stripe \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy log-security-event (no JWT — pre-login eventos como failed_login_attempt)
        run: |
          supabase functions deploy log-security-event \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy complete-oauth-onboarding (no JWT — verifica access_token Google internamente)
        run: |
          supabase functions deploy complete-oauth-onboarding \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy google-oauth-initiate
        run: |
          supabase functions deploy google-oauth-initiate \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy google-oauth-callback
        run: |
          supabase functions deploy google-oauth-callback \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy send-email
        run: |
          supabase functions deploy send-email \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy notify-package (no JWT — invocada por trigger Postgres con service_role)
        run: |
          supabase functions deploy notify-package \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy route-reminders (no JWT — invocada por pg_cron con service_role)
        run: |
          supabase functions deploy route-reminders \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy health (no JWT — endpoint público para monitoreo externo)
        run: |
          supabase functions deploy health \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt

      - name: Deploy signup-company (no JWT — onboarding self-service público; valida origin + fuerza password + Supabase Auth email confirmation)
        run: |
          supabase functions deploy signup-company \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt
