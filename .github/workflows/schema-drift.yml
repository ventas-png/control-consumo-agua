name: Auditor de drift de esquema

# Reconstruye el esquema en Postgres desechables y lo compara EN TRES VÍAS,
# dimensión por dimensión:
#
#   P  la instantánea del catálogo de producción (huella-produccion.json)
#   M  la reconstrucción de la rama base
#   R  la reconstrucción del HEAD de este PR
#
#   M == R          el PR no toca el objeto      → trinquete estricto contra P
#   P == M, R ≠ M   falta desplegarlo            → CAMBIO PLANIFICADO, pasa
#   R == P, M ≠ P   el PR cierra el drift        → DRIFT RESUELTO, pasa
#   P ≠ M ≠ R ≠ P   nadie coincide con nadie     → CAMBIO AMBIGUO, falla
#
# POR QUÉ TRES Y NO DOS. Con sólo P y R, «alguien tocó producción por fuera» y
# «este PR agrega una migración que todavía no se desplegó» se ven idénticos.
# #828 lo dejó a la vista: cerrar la lectura sin autenticar de payment_requests
# puso este workflow en rojo por hacer exactamente lo que había que hacer. Un
# auditor que castiga la corrección enseña a ampliar la baseline — el hábito que
# existe para impedir. La baseline sigue sin poder crecer, y un cambio
# planificado pasa SIN tocarla.
#
# QUÉ PROBLEMA RESUELVE. `src/test/rls/rlsHarness.test.ts` afirma que
# `payment_requests` no tiene policy de SELECT y que anon no lee ni una fila. El
# harness corre contra un esquema construido desde el repositorio, así que pasa.
# Producción tiene `payment_requests_select · SELECT · TO public · USING (true)`,
# que ninguna migración declara. El test estaba verde y mentía. Mientras el
# repositorio no describa producción, cualquier garantía verificada contra el
# repositorio deja de decir nada sobre producción — y ese es el agujero, no las
# diferencias en sí.
#
# CÓMO SE RELACIONA CON LO QUE YA HABÍA. No se solapa:
#   drift-esquema.yml           → una dirección y una dimensión: que toda columna
#                                 declarada por una migración aplicada exista en
#                                 producción. Necesita credenciales.
#   columnas-vs-migraciones.mjs → app ↔ migraciones.
#   security-guard.mjs          → aislamiento en producción.
#   este workflow               → tres vías y nueve dimensiones
#                                 (tablas, columnas, constraints, índices,
#                                 policies, grants, triggers, funciones, vistas),
#                                 SIN credenciales.
#
# NO USA `pull_request_target`, NI AQUÍ NI EN NINGÚN JOB. Ese disparador corre
# con el token y los secretos del repositorio base sobre código que propone
# quien abre el PR; para un workflow que existe para tocar producción sería
# regalar la llave. `pull_request` alcanza de sobra porque el job offline no
# necesita ningún secreto.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/schema-drift/**'
      - '.github/workflows/schema-drift.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/schema-drift/**'
  workflow_dispatch:

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # VERIFICAR — que el auditor sirva
  # ══════════════════════════════════════════════════════════════════════════
  #
  # Todo lo que prueba el AUDITOR, separado del veredicto que el auditor emite.
  # La separación no es cosmética: el veredicto se pone rojo cuando producción y
  # la instantánea versionada divergen, que es un hecho del mundo y no un
  # defecto del código. Mezclados en un job, cada divergencia de producción
  # apagaba las pruebas —`steps` posteriores no corren si uno falla— y el
  # auditor se quedaba sin la evidencia de que funciona justo cuando hay algo
  # que auditar.
  #
  # Cada paso lleva `if: !cancelled()`: una prueba que falla no puede saltear a
  # las siguientes. Lo que se quiere de este job es el cuadro COMPLETO, no el
  # primer error.
  verificar:
    name: Pruebas del auditor
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          # El trinquete compara esta baseline contra la de la rama base, así que
          # hace falta más de un commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Comprobar que hay servidor de Postgres (no sólo psql)
        run: |
          set -euo pipefail
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin | tail -1

      # ── M: qué se compara como «rama base» ─────────────────────────────
      #
      # En `pull_request`, el merge-base con la rama base: si la base avanzó
      # desde que se abrió el PR, comparar contra su punta le atribuiría al PR
      # cambios que no hizo. En `push` a main, `github.event.before`, y si no
      # resuelve —push forzado, rama recién creada— el primer padre.
      #
      # La lógica NO se reimplementa acá en bash: se llama al mismo módulo que
      # cubren las pruebas, para que CI corra lo que está probado. Si no se
      # puede resolver M, esto falla: no se degrada a la comparación de dos
      # vías, que es justamente la que no distingue drift de cambio planificado.
      #
      # Los datos de GitHub entran por ENV, no interpolados en el script. Una
      # rama base se llama como quiera quien la crea, y `${{ }}` dentro de un
      # `run` se pega textualmente antes de que bash vea nada: un nombre de rama
      # con comillas y un `;` sería ejecución de comandos en este runner.
      - name: Resolver la rama base (M)
        id: base
        if: ${{ !cancelled() }}
        env:
          EVENTO: ${{ github.event_name }}
          RAMA_BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref=$(node scripts/schema-drift/base-git.mjs \
            --evento "$EVENTO" \
            --rama-base "origin/$RAMA_BASE" \
            --antes "$ANTES")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Las propiedades de la huella se prueban contra un catálogo REAL, no
      # contra una reimplementación en JavaScript: lo que puede fallar es la
      # serialización en SQL. Determinismo, estabilidad ante el mismo catálogo
      # leído con otro plan, formato SHA-256 y sensibilidad a un cambio mínimo.
      - name: Propiedades de la huella (determinismo, equivalencia, sensibilidad)
        if: ${{ !cancelled() }}
        run: node scripts/schema-drift/auditar.mjs --verificar-huella

      # El espaciado DENTRO del contenido —literales SQL, cuerpos dollar-quoted,
      # expresiones de policy y default— tiene que mover la huella. Una versión
      # anterior colapsaba espacios de forma global y borraba esas diferencias:
      # un falso negativo de seguridad. Estos cuatro casos fallarían con aquella
      # versión.
      - name: Espaciado que es contenido, no formato
        if: ${{ !cancelled() }}
        run: node scripts/schema-drift/auditar.mjs --prueba-espacios

      # Los grants salen del ACL (`relacl`/`proacl`), no de information_schema,
      # que es RELATIVO AL ROL. Se comprueban las tres mitades: que la
      # serialización no cambió respecto de la formulación anterior —si
      # cambiara, `huella-produccion.json` dejaría de ser comparable y las ~563
      # dimensiones `/grants` aparecerían como drift falso—, que un rol DEDICADO
      # DE SOLO LECTURA saca exactamente la misma huella, y que WITH GRANT
      # OPTION mueve la huella sin mover el conteo.
      - name: Los grants se leen del ACL y los alcanza un rol de solo lectura
        if: ${{ !cancelled() }}
        run: node scripts/schema-drift/auditar.mjs --prueba-acl

      # El modo live de punta a punta contra un clúster desechable que hace de
      # producción: conexión por URL con un rol distinto (no `SET ROLE`),
      # credencial medida —un rol por cada privilegio que se rechaza—, huella
      # leída, guards, escritura atómica. Corre SIN credenciales y sin red — de
      # eso se trata: que el camino que va a tocar producción esté probado antes
      # de que exista el secreto.
      - name: Modo live de punta a punta (sin credenciales, contra un clúster desechable)
        if: ${{ !cancelled() }}
        run: node scripts/schema-drift/auditar.mjs --prueba-live

      # Las cuatro reglas contra un catálogo REAL: se construye M desde las
      # migraciones tal como están y R desde las mismas más UNA migración
      # append-only, y se exige que el auditor llame a eso cambio planificado y
      # a nada más — y que el MISMO cambio sin migración nueva, o con una
      # histórica reescrita, rompa.
      - name: Tres vías contra un catálogo real (planificado vs. sin migración)
        if: ${{ !cancelled() }}
        run: node scripts/schema-drift/auditar.mjs --prueba-tres-vias

      # El auditor tiene que ROMPER ante drift que no declara. Un auditor que
      # siempre diga «todo bien» pasa cualquier prueba positiva, así que la
      # prueba que importa es ésta: se inyecta una columna que ninguna migración
      # declara y una policy en una tabla que YA está en la baseline —para que
      # no pueda esconderse detrás de ella— y se exige salida distinta de cero.
      #
      # La inyección va a los DOS clústeres, M y R. Inyectarla sólo en R la
      # haría indistinguible de un cambio planificado, y la prueba dejaría de
      # probar lo que dice: así el objeto queda como «uno que el PR no toca»,
      # que es donde el trinquete estricto tiene que romper.
      - name: Prueba negativa — el auditor debe fallar
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          set +e
          salida=$(node scripts/schema-drift/auditar.mjs \
            --base "$BASE" --prueba-negativa 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          if [ "$codigo" -eq 0 ]; then
            echo "::error::El auditor NO detectó la columna ni la policy inyectadas. No sirve."
            exit 1
          fi
          echo "$salida" | grep -q 'DRIFT NUEVO'    || { echo "::error::No reportó la columna inesperada."; exit 1; }
          echo "$salida" | grep -q 'DRIFT AGRAVADO' || { echo "::error::No reportó la policy inesperada dentro de un grupo ya baselineado."; exit 1; }
          echo "✓ el auditor detecta ambas inyecciones y sale $codigo"

  # ══════════════════════════════════════════════════════════════════════════
  # VEREDICTO — el drift real de este cambio
  # ══════════════════════════════════════════════════════════════════════════
  #
  # Lo que este workflow existe para decir: comparar P, M y R y fallar si hay
  # drift que nadie declaró. Depende de `verificar` porque el veredicto de un
  # auditor roto no significa nada; si las pruebas fallan, este job no corre y
  # el rojo que se ve es el de las pruebas, que es el que hay que arreglar
  # primero.
  #
  # SE PONE ROJO CUANDO `huella-produccion.json` ENVEJECE, y eso no es un
  # defecto: es el mecanismo. Cuando una migración llega a producción, la
  # instantánea queda vieja y el auditor lo dice hasta que alguien la refresca
  # —el job `live` de abajo— y versiona el diff en un PR. Por eso `live` NO
  # depende de este job: dependería del veredicto que viene a corregir.
  veredicto:
    name: Auditar drift en tres vías (offline, sin credenciales)
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Comprobar que hay servidor de Postgres (no sólo psql)
        run: |
          set -euo pipefail
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin | tail -1

      - name: Auditar drift en tres vías (offline, sin credenciales)
        env:
          BASE: ${{ needs.verificar.outputs.base }}
        run: node scripts/schema-drift/auditar.mjs --base "$BASE"

  # ══════════════════════════════════════════════════════════════════════════
  # MODO LIVE — implementado, y apagado hasta que exista la credencial
  # ══════════════════════════════════════════════════════════════════════════
  #
  # Refresca `huella-produccion.json` leyendo el catálogo real. El camino está
  # implementado y PROBADO (`--prueba-live`, en `verificar`, contra un clúster
  # desechable que hace de producción); lo único que falta para encenderlo es la
  # credencial. Mientras no exista NO se conecta a nada:
  #
  #   · Credencial DEDICADA de SOLO LECTURA. Un rol de Postgres con USAGE sobre
  #     `public` y `extensions` —los dos esquemas del `search_path`— y nada más.
  #     Los dos: sin USAGE sobre `extensions`, `format_type` y `pg_get_expr`
  #     cualifican los nombres de ahí (`extensions.citext` en vez de `citext`) y
  #     la huella deja de coincidir con la del dueño. El job lo comprueba y se
  #     niega en vez de versionar una huella distinta.
  #     Se MIDE, no se declara: superusuario, BYPASSRLS, CREATEROLE, CREATEDB,
  #     REPLICATION, escritura, SELECT de tabla, SELECT por columna, CREATE
  #     sobre esquemas, membresías y funciones SECURITY DEFINER alcanzables —en
  #     cualquier esquema no interno, porque esto se conecta a Postgres y no a
  #     PostgREST—. Cada una de esas reglas tiene su rol culpable en
  #     `--prueba-live`.
  #   · Y la CADENA DE CONEXIÓN se revisa antes de abrirla. El hostname solo no
  #     alcanza: con `?hostaddr=` libpq se conecta a esa IP y usa el host sólo
  #     para el certificado, y con `?options=` se deshace por URL el
  #     `default_transaction_read_only` que PGOPTIONS fija por entorno. Lista
  #     blanca de parámetros, sin repetidos, y `sslmode` obligatorio.
  #     NO se reutiliza `SUPABASE_ACCESS_TOKEN`: ese token es de la Management
  #     API y puede aplicar DDL, crear y borrar ramas y leer secretos. Que
  #     drift-esquema.yml ya lo use no es razón para extender su alcance — es
  #     una razón más para no hacerlo.
  #   · Detrás del environment `production-db`, que desde el 2026-09-01 está
  #     restringido a `main`, con revisores requeridos y sin bypass de
  #     administradores. Ahí es donde vive el secreto, no a nivel de repo. Esa
  #     restricción a `main` se conserva EN EL ENVIRONMENT: el `if` de abajo la
  #     repite, no la reemplaza. Un `if` es una condición del workflow y lo
  #     cambia cualquiera que pueda editar este archivo; la regla del
  #     environment la hace cumplir GitHub aunque el archivo mienta.
  #   · NUNCA desde `pull_request` ni `pull_request_target`: sólo
  #     `workflow_dispatch`, donde la referencia es de confianza.
  #
  # Para encenderlo: crear el rol de solo lectura en producción
  #
  #     CREATE ROLE drift_readonly LOGIN PASSWORD '…';
  #     GRANT USAGE ON SCHEMA public, extensions TO drift_readonly;
  #
  # guardar su cadena de conexión —con `?sslmode=require` como mínimo, y nada
  # más en la query— como `SCHEMA_DRIFT_READONLY_URL` en el
  # environment `production-db`, y poner la variable de repositorio
  # `SCHEMA_DRIFT_LIVE_HABILITADO` en `true`.
  #
  # NO SE COMMITEA NADA DESDE AQUÍ. El job es de solo lectura de los dos lados:
  # `contents: read` y una credencial sin permisos de escritura. La huella
  # refrescada sale como ARTEFACTO, y el PR que la versiona se abre aparte, con
  # el diff a la vista. Darle `contents: write` a un job que además tiene acceso
  # a la base de producción sería juntar las dos mitades de un problema.
  live:
    name: Refrescar la huella de producción
    # Cuatro condiciones, y las cuatro tienen que darse:
    #
    #   · `workflow_dispatch` — la única referencia de confianza. En
    #     `pull_request` el código lo propone quien abre el PR; darle a eso la
    #     credencial de producción sería regalar la llave.
    #   · `refs/heads/main` — se despacha sobre una rama, y una rama cualquiera
    #     puede traer un `auditar.mjs` modificado. El environment lo exige
    #     además por su cuenta (ver arriba).
    #   · La variable de repositorio, para que encender el modo live sea un acto
    #     deliberado y no el efecto colateral de que aparezca un secreto.
    #   · `needs: verificar` en su forma normal: acá SÍ se exige que las pruebas
    #     pasen. Lo que no se puede exigir es el VEREDICTO —eso era circular: la
    #     auditoría falla cuando la instantánea envejece, que es exactamente lo
    #     que este job viene a arreglar—, pero un auditor cuyas pruebas fallan
    #     no tiene por qué acercarse a producción.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && vars.SCHEMA_DRIFT_LIVE_HABILITADO == 'true' }}
    needs: verificar
    runs-on: ubuntu-latest
    environment: production-db
    permissions:
      contents: read
    steps:
      # Checkout EXPLÍCITO del SHA que disparó la corrida, no de «lo que haya
      # en main ahora». Entre el despacho y el arranque del job —que puede
      # esperar la aprobación del environment— `main` avanza; sin `ref` se
      # ejecutaría código que nadie miró al aprobar. El `if` del job ya exigió
      # que ese SHA sea de `main`.
      #
      # `persist-credentials: false`: este job no empuja nada, así que no tiene
      # por qué dejar el token del runner escrito en `.git/config` mientras
      # habla con la base de producción.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # La URL nunca se imprime: viaja por el entorno y el script recorta de
      # sus propios mensajes de error cualquier cadena de conexión antes de
      # escribirlos. Un secreto que llega al log de Actions es un secreto
      # quemado.
      #
      # El `id` es lo que permite que los pasos de abajo distingan «refrescó» de
      # «falló»: sin él, `always()` publicaría la instantánea VIEJA —la que
      # estaba versionada— como si fuera el resultado del refresco.
      - name: Refrescar la huella leyendo el catálogo real
        id: refresco
        env:
          SCHEMA_DRIFT_READONLY_URL: ${{ secrets.SCHEMA_DRIFT_READONLY_URL }}
        run: node scripts/schema-drift/auditar.mjs --sembrar-produccion

      # ── Sólo si refrescó ────────────────────────────────────────────────
      #
      # El script escribe en un temporal, lo relee y recién entonces reemplaza
      # con `rename(2)`, así que un fallo deja el archivo versionado intacto.
      # Esta comprobación es la otra mitad, del lado del workflow: que lo que se
      # va a publicar sea la lectura de HOY y no la instantánea de siempre.
      - name: Comprobar que se publica la huella nueva y no la versionada
        if: ${{ steps.refresco.outcome == 'success' }}
        run: |
          set -euo pipefail
          capturada=$(node -p "require('./scripts/schema-drift/huella-produccion.json').capturada")
          hoy=$(date -u +%F)
          ayer=$(date -u -d '1 day ago' +%F)
          if [ "$capturada" != "$hoy" ] && [ "$capturada" != "$ayer" ]; then
            echo "::error::El archivo dice capturada=$capturada (hoy es $hoy): no es el refresco de esta corrida."
            exit 1
          fi
          echo "✓ huella capturada $capturada"

      # `git diff` sobre el archivo, para que el resumen del job diga qué
      # cambió sin que haya que descargar nada. Son huellas SHA-256 y conteos:
      # no hay nada sensible que ocultar aquí.
      - name: Resumen del refresco
        if: ${{ steps.refresco.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            echo '## Huella de producción'
            echo
            if git diff --quiet -- scripts/schema-drift/huella-produccion.json; then
              echo 'La instantánea ya estaba al día: no cambió ningún grupo.'
            else
              echo '```diff'
              git diff --unified=0 -- scripts/schema-drift/huella-produccion.json | head -200
              echo '```'
            fi
            echo
            echo 'El artefacto de esta corrida es la huella refrescada. Versionarla va por PR aparte.'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Y si no refrescó ────────────────────────────────────────────────
      #
      # Un resumen que no deja lugar a dudas. El modo de fallo que se evita es
      # el peor de todos: alguien encuentra un artefacto en una corrida roja, lo
      # da por bueno y versiona la instantánea vieja como si fuera producción de
      # hoy. Acá no hay artefacto, y el resumen lo dice con todas las letras.
      - name: Sin artefacto — el refresco no terminó bien
        if: ${{ !cancelled() && steps.refresco.outcome != 'success' }}
        env:
          RESULTADO: ${{ steps.refresco.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Huella de producción — NO se refrescó'
            echo
            echo "El paso de refresco terminó en \`$RESULTADO\`."
            echo
            echo '**Esta corrida NO publica ningún artefacto.** No hay una huella válida que'
            echo 'versionar: la instantánea del repositorio quedó intacta y sigue siendo la'
            echo 'anterior. No la tomes de acá ni de una corrida anterior — volvé a despachar'
            echo 'el workflow cuando esté resuelto lo que falló.'
            echo
            echo 'El log del paso dice el motivo exacto; las cadenas de conexión se recortan'
            echo 'antes de escribirse, así que se puede leer entero.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la huella refrescada
        if: ${{ steps.refresco.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: huella-produccion-${{ github.run_id }}
          path: scripts/schema-drift/huella-produccion.json
          retention-days: 14
          if-no-files-found: error
