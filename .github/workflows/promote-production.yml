name: Promote / Rollback Production (Vercel)

# Promoción canary + rollback instantáneo de producción (infra:I19/I20).
#
# Estrategia (SPA en Vercel; no hay split de tráfico por % sin middleware, así que
# el "canary" es promoción escalonada con smoke test + rollback instantáneo):
#
#   preview (PR)  ─merge→  staging (deploy-staging.yml + smoke)  ─promote→  producción
#                                                                    │
#                                                            rollback ▼ (instantáneo)
#
#   - promote:  toma un deployment YA construido (el de staging que validaste) y
#               lo marca como producción. NO reconstruye → el binario que probaste
#               en staging es bit-a-bit el que sirve prod (cero "funcionó en mi
#               máquina").
#   - rollback: Vercel Instant Rollback al deployment de producción anterior (o a
#               uno específico). Segundos, sin rebuild.
#
# Manual (workflow_dispatch) a propósito: promover/revertir prod es una decisión
# humana. Requiere VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options: [promote, rollback]
        required: true
        default: promote
      target_url:
        description: 'Deployment URL/ID. promote: el de staging a promover (requerido). rollback: opcional (vacío = al anterior).'
        required: false
        default: ''

concurrency:
  # Serializa: nunca dos promociones/rollbacks de prod a la vez.
  group: production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de GitHub:$missing"
            exit 1
          fi

  release:
    needs: check-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Promote to production
        if: ${{ inputs.action == 'promote' }}
        run: |
          if [ -z "${{ inputs.target_url }}" ]; then
            echo "::error::'promote' requiere target_url (la URL del deployment de staging validado)."
            exit 1
          fi
          echo "Promoviendo ${{ inputs.target_url }} a producción…"
          vercel promote "${{ inputs.target_url }}" --token="${{ secrets.VERCEL_TOKEN }}" --yes
          echo "PROD_TARGET=${{ inputs.target_url }}" >> "$GITHUB_ENV"

      - name: Rollback production
        if: ${{ inputs.action == 'rollback' }}
        run: |
          # Sin target → Vercel revierte al deployment de producción anterior.
          echo "Rollback de producción (target: '${{ inputs.target_url }}' — vacío = anterior)…"
          vercel rollback ${{ inputs.target_url }} --token="${{ secrets.VERCEL_TOKEN }}" --yes

      # Smoke test del dominio de producción tras el cambio. Override del dominio
      # con la variable de repo PROD_URL (default: el dominio público conocido).
      - name: Smoke test production
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://administratodo.com' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 6 --retry-delay 5 --retry-all-errors "$PROD_URL")
          echo "GET $PROD_URL → $code"
          if [ "$code" != "200" ]; then
            echo "::error::Smoke test de producción falló (HTTP $code). Considera 'rollback' inmediato."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release de producción"
            echo "- **Acción:** ${{ inputs.action }}"
            echo "- **Target:** ${{ inputs.target_url || '(anterior)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
