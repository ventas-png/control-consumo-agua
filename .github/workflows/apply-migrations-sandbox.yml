name: Apply Migrations to Sandbox

# ════════════════════════════════════════════════════════════════════════════
# Sincroniza el SANDBOX de E2E (`control-agua-rls-sandbox`) con `main`.
# NUNCA toca producción.
# ════════════════════════════════════════════════════════════════════════════
#
# · SOLO workflow_dispatch: ni `push` ni `schedule`. Una migración que llega a
#   `main` NO se aplica aquí sola; se dispara a mano, una por corrida.
# · El proyecto está FIJADO en este archivo (SANDBOX_PROJECT_REF). No sale de
#   ningún secret: con una variable no se puede apuntar este workflow a
#   producción por error. Antes de escribir se lee el nombre del proyecto en la
#   Management API y se aborta si no es `control-agua-rls-sandbox`.
# · UNA migración por corrida (`migration_file`, obligatorio). No hay modo
#   reconciliar: el sandbox va por detrás de `main` y reaplicar "todo lo que
#   falte" es el patrón del incidente 2026-08-03 de producción. El tope de
#   MAX_APPLY (10) se conserva por la misma razón y NO se sube.
# · EN ORDEN: sólo se acepta la MENOR versión local aún no registrada en el
#   historial del sandbox. Saltarse una es un error.
# · Mismos criterios que apply-migrations-prod: se mira el código HTTP y que el
#   cuerpo sea un array de filas, y el registro en
#   supabase_migrations.schema_migrations es FAIL-CLOSED.
# · Sin reset, sin recrear, sin reparar el historial en bloque.
#
# Requiere el secret SUPABASE_ACCESS_TOKEN (Management API) con acceso al
# proyecto sandbox, visible desde el Environment `sandbox-db` o como secret de
# repositorio.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Archivo único a aplicar (nombre suelto, sin supabase/migrations/). Debe ser la menor versión pendiente del sandbox.'
        required: true

concurrency:
  # No cancelar una aplicación a medias: encolar.
  group: apply-migrations-sandbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: sandbox-db
    env:
      SANDBOX_PROJECT_REF: jwpmivhvlstslncrtokb
      SANDBOX_PROJECT_NAME: control-agua-rls-sandbox
      API_URL: https://api.supabase.com/v1/projects/jwpmivhvlstslncrtokb/database/query
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      INPUT_FILE: ${{ github.event.inputs.migration_file }}
      MAX_APPLY: '10'
    steps:
      - name: Verify token is set
        run: |
          if [ -z "${ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN. Cárgalo en Settings → Environments → sandbox-db → Secrets (o como secret de repositorio)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Identidad: el proyecto al que apunta API_URL es el sandbox, no otro.
      - name: Verify the target is the sandbox
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/proj.json -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/$SANDBOX_PROJECT_REF" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::No se pudo leer el proyecto sandbox (HTTP $code): $(head -c 300 /tmp/proj.json)"
            exit 1
          fi
          nombre=$(jq -r '.name // empty' /tmp/proj.json)
          ref=$(jq -r '.id // .ref // empty' /tmp/proj.json)
          if [ "$ref" != "$SANDBOX_PROJECT_REF" ] || [ "$nombre" != "$SANDBOX_PROJECT_NAME" ]; then
            echo "::error::El proyecto no es el sandbox esperado (ref=$ref nombre=$nombre). Abortado sin escribir."
            exit 1
          fi
          echo "Proyecto verificado: $nombre ($ref)"

      - name: Select the migration (in order, not yet applied)
        id: list
        run: |
          set -uo pipefail
          MIG_DIR="supabase/migrations"
          code=$(curl -s -o /tmp/hist-resp.json -w "%{http_code}" -X POST "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"select version from supabase_migrations.schema_migrations order by version"}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ] || ! jq -e 'type == "array"' >/dev/null 2>&1 < /tmp/hist-resp.json; then
            echo "::error::No se pudo leer el historial del sandbox (HTTP $code): $(head -c 300 /tmp/hist-resp.json)"
            exit 1
          fi
          jq -r '.[].version' /tmp/hist-resp.json > /tmp/applied-versions.txt
          # Formato, contención y "no aplicada ya": el mismo validador que producción.
          node scripts/validar-migration-dispatch.mjs \
            --file "$INPUT_FILE" --dir "$MIG_DIR" --aplicadas /tmp/applied-versions.txt || exit 1
          # En orden: la menor versión local que falte.
          siguiente=""
          for f in $(ls "$MIG_DIR"/*.sql | sort); do
            base=$(basename "$f" .sql); ver=${base%%_*}
            if ! grep -qxF "$ver" /tmp/applied-versions.txt; then siguiente="$base.sql"; break; fi
          done
          if [ "$siguiente" != "$INPUT_FILE" ]; then
            echo "::error::Fuera de orden: la siguiente pendiente es '$siguiente', no '$INPUT_FILE'."
            exit 1
          fi
          pendientes=$(for f in $(ls "$MIG_DIR"/*.sql | sort); do b=$(basename "$f" .sql); v=${b%%_*}; grep -qxF "$v" /tmp/applied-versions.txt || echo x; done | wc -l)
          echo "Pendientes en el sandbox: $pendientes. Esta corrida aplica 1."
          echo "file=$MIG_DIR/$INPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Apply and register
        env:
          FILE: ${{ steps.list.outputs.file }}
        run: |
          set -uo pipefail
          base=$(basename "$FILE" .sql); ver=${base%%_*}; name=${base#*_}
          {
            echo "### Aplicación al SANDBOX (\`$SANDBOX_PROJECT_REF\`)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Cuerpo por ARCHIVO (límite de 128 KiB por argumento de Linux).
          jq -Rs '{query: .}' < "$FILE" > /tmp/apply-payload.json
          code=$(curl -s -o /tmp/apply-resp.json -w "%{http_code}" -X POST "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/apply-payload.json)
          echo "HTTP $code"; head -c 600 /tmp/apply-resp.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ] || ! jq -e 'type == "array"' >/dev/null 2>&1 < /tmp/apply-resp.json; then
            echo "- ❌ \`$base\` — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Falló $base (HTTP $code): $(head -c 300 /tmp/apply-resp.json). No se registró."
            exit 1
          fi
          hist="insert into supabase_migrations.schema_migrations (version, name) values ('$ver', '$name') on conflict (version) do nothing;"
          jq -Rs '{query: .}' <<<"$hist" > /tmp/hist-payload.json
          hcode=$(curl -s -o /tmp/hist-resp.json -w "%{http_code}" -X POST "$API_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/hist-payload.json)
          if [ "$hcode" -lt 200 ] || [ "$hcode" -ge 300 ] || ! jq -e 'type == "array"' >/dev/null 2>&1 < /tmp/hist-resp.json; then
            echo "- ⛔ \`$base\` — **DDL aplicado pero SIN registrar** (HTTP $hcode)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$base SE APLICÓ pero NO se registró (HTTP $hcode). No reintentar sin verificar el historial del sandbox."
            exit 1
          fi
          echo "- ✅ \`$base\`" >> "$GITHUB_STEP_SUMMARY"
