# El nombre conserva "& E2E" sólo en la historia de git: hoy la suite E2E vive
# en .github/workflows/e2e.yml.
name: Coverage gate

# ADITIVO a ci.yml (no lo toca). ci.yml corre tsc/test/build + coverage ADVISORY
# (sin umbral). Este workflow agrega lo que falta para el Track T8:
#   • coverage-gate: umbral DURO sobre la lógica de negocio crítica (money/auth).
#   • rls-sandbox:   RLS de recepción contra un Postgres desechable.
#   • rls-harness:   verificación RLS server-side, FAIL-CLOSED (ver el job).
# La suite Playwright vive en su PROPIO workflow (.github/workflows/e2e.yml):
# necesita una concurrency incompatible con la de aquí (grupo fijo del sandbox
# compartido, sin cancelar en curso) y no corre en push a main (ver su header).
# rls-harness no admite el verde sin ejecutar: exige sus 15 variables RLS_* y
# falla si falta cualquiera. Los contextos sin secretos por diseño (PR de
# fork, Dependabot) también quedan en ROJO, con la explicación estructural.
# Sin `pull_request_target`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos del GITHUB_TOKEN (auditoría 2026-07-28, PR-20). Sin bloque
# `permissions` se heredan los del repositorio, que por defecto pueden ser de
# escritura: un step comprometido (o una dependencia que ejecute código en
# postinstall) podría entonces empujar commits o publicar releases. Ninguno de
# estos workflows escribe en el repo.
permissions:
  contents: read

jobs:
  coverage-gate:
    name: Coverage gate (lógica de negocio crítica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate de UMBRAL sobre la lógica pura de negocio/auth (money/auth), donde la
      # cobertura es real (~95%). Se corren SÓLO los test files dedicados de esos
      # módulos: determinista, rápido (~7s) y sin el flake de timers que la
      # instrumentación v8 provoca en tests de componentes (por eso ci.yml deja su
      # coverage como advisory). Un umbral global de src/** sería ~9% (todo el UI
      # sin unit tests) — inútil como gate. Umbrales vía CLI para NO tocar
      # vite.config.ts (propiedad de la otra sesión). El "tests verdes" de toda la
      # suite lo cubre ci.yml.
      - name: Vitest + umbral de coverage (lógica de negocio crítica)
        run: |
          npx vitest run \
            src/lib/__tests__/business.test.ts \
            src/lib/__tests__/businessCondominios.test.ts \
            src/lib/__tests__/businessFiscal.test.ts \
            src/lib/__tests__/businessPagos.test.ts \
            src/lib/__tests__/businessEnergia.test.ts \
            src/lib/__tests__/validation.test.ts \
            src/lib/__tests__/permissions.test.ts \
            src/lib/__tests__/condominiosRoles.test.ts \
            src/lib/__tests__/systemRoleIds.test.ts \
            src/lib/__tests__/aguaPermissions.test.ts \
            src/lib/__tests__/proyectosAccess.test.ts \
            src/lib/__tests__/rutasAccess.test.ts \
            --coverage \
            --coverage.include='src/lib/business.ts' \
            --coverage.include='src/lib/businessCondominios.ts' \
            --coverage.include='src/lib/businessFiscal.ts' \
            --coverage.include='src/lib/businessPagos.ts' \
            --coverage.include='src/lib/businessEnergia.ts' \
            --coverage.include='src/lib/validation.ts' \
            --coverage.include='src/lib/permissions.ts' \
            --coverage.include='src/lib/condominiosRoles.ts' \
            --coverage.include='src/lib/systemRoleIds.ts' \
            --coverage.include='src/lib/aguaPermissions.ts' \
            --coverage.include='src/lib/proyectosAccess.ts' \
            --coverage.include='src/lib/rutasAccess.ts' \
            --coverage.thresholds.lines=90 \
            --coverage.thresholds.statements=90 \
            --coverage.thresholds.functions=90 \
            --coverage.thresholds.branches=85

      # ── Gate 2: lógica pura de src/domain/** (auditoría 2026-07-28, PR-31) ──
      #
      # El gate de arriba cubre 12 archivos de `src/lib/`. `src/domain/**` —toda
      # la capa de queries/mutations/cálculo, incluida la contabilidad, los EEFF,
      # el presupuesto y el aging de cartera— NO tenía ningún umbral.
      #
      # ALCANCE DELIBERADO: sólo los archivos de CÁLCULO Y VALIDACIÓN PUROS.
      # Los `queries.ts` / `mutations.ts` / `billing.ts` / `paymentConfig.ts` de
      # estos mismos dominios quedan FUERA a propósito, y la omisión no es un
      # descuido: son cadenas del query builder de Supabase, así que cubrirlas
      # sólo mide cuánto mock se escribió ("se llamó .eq() con esta columna"),
      # no si el dinero se calcula bien. Meterlos bajaría el umbral alcanzable a
      # ~68% y convertiría el gate en un número que nadie mira. El contrato de
      # error de esa capa lo fija `src/domain/__tests__/queryFetch.test.ts`; que
      # los call sites lo usen es trabajo aparte (PR-28), no de cobertura.
      #
      # Los 9 archivos de abajo están HOY al 100/100/100/100 (275 stmts, 151
      # ramas). El umbral se deja 5 puntos por debajo —misma holgura que el gate
      # de `src/lib/`, que corre al ~95% contra 90/85— para que falle ante una
      # regresión real y no ante un refactor de una línea.
      - name: Vitest + umbral de coverage (cálculo puro de src/domain/**)
        run: |
          npx vitest run \
            src/domain/eeff/__tests__/calculos.test.ts \
            src/domain/contabilidad/__tests__/arbol.test.ts \
            src/domain/contabilidad/__tests__/schemas.test.ts \
            src/domain/presupuesto/__tests__/proyeccion.test.ts \
            src/domain/presupuesto/__tests__/schemas.test.ts \
            src/domain/bancos/__tests__/schemas.test.ts \
            src/domain/cxp/__tests__/schemas.test.ts \
            src/domain/condominios/__tests__/schemas.test.ts \
            src/domain/agua/__tests__/schemas.test.ts \
            --coverage \
            --coverage.reportsDirectory=coverage-domain \
            --coverage.include='src/domain/eeff/calculos.ts' \
            --coverage.include='src/domain/contabilidad/arbol.ts' \
            --coverage.include='src/domain/contabilidad/schemas.ts' \
            --coverage.include='src/domain/presupuesto/proyeccion.ts' \
            --coverage.include='src/domain/presupuesto/schemas.ts' \
            --coverage.include='src/domain/bancos/schemas.ts' \
            --coverage.include='src/domain/cxp/schemas.ts' \
            --coverage.include='src/domain/condominios/schemas.ts' \
            --coverage.include='src/domain/agua/schemas.ts' \
            --coverage.thresholds.lines=95 \
            --coverage.thresholds.statements=95 \
            --coverage.thresholds.functions=95 \
            --coverage.thresholds.branches=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-critical-${{ github.run_id }}
          path: |
            coverage/
            coverage-domain/
          retention-days: 14
          if-no-files-found: warn

  rls-sandbox:
    name: RLS sandbox de recepción (Postgres desechable)
    runs-on: ubuntu-latest
    # SIN gate por secretos, a diferencia de rls-harness: estos runners levantan
    # su propio Postgres y aplican el SQL del repo, así que corren en CADA PR y
    # fallan de verdad. Son la única verificación conductual de la RLS de
    # recepción que no depende de tener un preview con usuarios sembrados.
    steps:
      - uses: actions/checkout@v7

      - name: Localizar el Postgres del runner
        id: pg
        run: |
          set -euo pipefail
          BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BIN" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          "$BIN/initdb" --version

      - name: Motor de recepción — policies por clase
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: scripts/rls-recepcion-sandbox.sh

      - name: Evidencias y acuse — bucket privado y RPC de entrega
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: scripts/rls-evidencias-sandbox.sh

      # La migración de mantenimiento valida una constraint y BORRA la única
      # copia de las filas originales de correspondencia. Su valor está en
      # abortar cuando algo no cuadra, así que se ejercita con datos que no
      # cuadran, no sólo con el camino feliz.
      - name: Cierre posfusión — validar el CHECK y retirar el respaldo
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: scripts/cierre-posfusion-sandbox.sh

      # La serie 20260904* migra DATOS (backfill de áreas por nombre
      # normalizado) y cambia una FK de CASCADE a RESTRICT: si el backfill ata
      # mal, corrompe en silencio; si la FK no queda, borrar una programación
      # sigue arrastrando el historial. Se ejercita contra un Postgres real,
      # incluida la re-aplicación completa (idempotencia).
      - name: Catálogos de limpieza — backfill, historial y puentes de recursos
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: supabase/tests/limpieza_catalogos/run.sh

      # El sandbox de arriba construye el esquema tal como lo DECLARAN las
      # migraciones, y por eso estaba verde el 2026-08-27 mientras el apply a
      # producción fallaba con 42703: allí `areas_condominio.activo` no existe.
      # Éste deforma el esquema hasta la forma real de producción antes de
      # probar, y empieza comprobando que sin la reparación el fallo se
      # reproduce — si dejara de reproducirse, el escenario ya no vale.
      - name: Drift de producción — la serie de limpieza sobre el esquema real
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: supabase/tests/drift_produccion/run.sh

      # Turnos y amenidades existen en producción con OTROS NOMBRES para el
      # mismo concepto (finalizado_en, completado_en, foto_url), que ninguna
      # migración declara. La reparación renombra y convierte datos, así que no
      # basta con comprobar que las columnas existan: este sandbox monta la forma
      # real, verifica que los cuatro gestos rotos fallan ahí, y que tras la
      # migración la evidencia sobrevivió al cambio de text a jsonb.
      - name: Drift de turnos — renombres y conversión de evidencia
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
        run: supabase/tests/drift_turnos/run.sh

      # Re-escribir ocho políticas RLS "sin cambiar nada" es de las cosas que
      # sólo se comprueban ejecutándolas: mide los mismos seis accesos antes y
      # después de aplicar la migración, contra las políticas de producción.
      - name: Envoltorio (SELECT …) en suministros — los accesos no cambian
        run: supabase/tests/rls_initplan_suministros/run.sh

      # Un renombre de columna arrastra índices, policies y vistas, pero NO los
      # cuerpos plpgsql —son texto— ni los argumentos de un trigger —son
      # literales—. Eso dejó `actividad_equipo` reventando con 42703 y
      # `trg_sellar_cierre` sellando en silencio contra una clave inexistente.
      # Ninguna guarda de esquema puede verlo: hay que EJECUTAR la RPC y
      # COMPLETAR una tarea, en la forma de producción y en una base nueva.
      - name: Actividad del equipo — la RPC se ejecuta y el cierre vuelve a sellarse
        run: supabase/tests/actividad_equipo/run.sh

      # Los dos selectores de asignación: quién puede quedar registrado como el
      # usuario de un empleado, y quién puede quedar como responsable de una
      # ruta. Los dos harness existían y NINGUNO corría en CI — 43 invariantes
      # que sólo se ejecutaban a mano. Llevan puerto propio porque varios
      # sandboxes comparten el de por defecto y aquí corren en fila.
      - name: Personal — el catálogo de cuentas se acota a este condominio
        env:
          PGPORT_TEST: 55481
        run: supabase/tests/personal_usuario/run.sh

      - name: Rutas — el operador asignable sale del proyecto de la ruta
        env:
          PGPORT_TEST: 55482
        run: supabase/tests/rutas_operadores/run.sh

      # 20260907000100 retira dos policies legacy company_rw_* que anulaban por
      # OR el gate RBAC —cualquier miembro de la empresa leía y escribía tareas
      # de turno— y le da a `tareas_bloque` las garantías que ya tenía
      # ejecuciones_limpieza: CHECK de estado, unicidad por plantilla, anulación
      # lógica sellada. Nada de eso se comprueba leyendo el SQL: hay que ver que
      # cada rol vea exactamente lo que le toca y que cargar plantillas dos veces
      # deje de duplicar. Incluye la re-aplicación completa.
      - name: Paridad de tareas_bloque — anulación sellada y RLS re-gateada
        env:
          PGPORT_TEST: 55483
        run: supabase/tests/tareas_bloque_paridad/run.sh

      # 20260907000200 descansa en CUATRO FKs compuestas (id, company_id,
      # project_id) y un trigger de sellado. Que estén escritas no demuestra que
      # el motor rechace mover de proyecto una fila ya relacionada, ni que el
      # trigger imponga el tenant por encima del cliente. El fallo que previene
      # es el peor en multi-tenant: una rutina apuntando al área o a la
      # actividad de OTRO condominio.
      - name: Rutinas de limpieza — tenant congelado por FK compuesta y RLS
        env:
          PGPORT_TEST: 55484
        run: supabase/tests/rutinas_limpieza/run.sh

      # 20260907000300 es una RPC con cinco JOINs, una ventana y cuatro conteos.
      # Que compile no dice que empareje por la jornada correcta, ni que la
      # segunda corrida no duplique, ni —lo más fácil de romper sin notarlo— que
      # no resucite lo que alguien anuló: un `NOT EXISTS` mirando sólo las
      # vigentes pasaría la revisión y repetiría cada anulación en cada corrida.
      - name: Materializar rutinas — snapshot, orden e idempotencia real
        env:
          PGBIN: ${{ steps.pg.outputs.bin }}
          PGPORT_TEST: 55485
        run: supabase/tests/materializar_rutinas/run.sh

  rls-harness:
    name: RLS harness (server-side)
    runs-on: ubuntu-latest
    env:
      RLS_SUPABASE_URL: ${{ secrets.RLS_SUPABASE_URL }}
      RLS_SUPABASE_ANON_KEY: ${{ secrets.RLS_SUPABASE_ANON_KEY }}
      # Declaración del proyecto contra el que se opera. NO es una credencial:
      # sin ella, cambiar `RLS_SUPABASE_URL` bastaría para que el harness —que
      # hace INSERT, UPDATE y DELETE— escribiera en otro proyecto sin que nada
      # lo notara. El preflight exige que coincida con el ref de la URL.
      RLS_EXPECTED_PROJECT_REF: ${{ secrets.RLS_EXPECTED_PROJECT_REF }}
      RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
      RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
      RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
      RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
      # Gate por CLASE de paquetes_recibidos: cuatro usuarios de la MISMA
      # empresa (ver src/test/rls/README.md). Son OBLIGATORIOS: el preflight los
      # exige junto a los otros siete y deja el job en ROJO si falta cualquiera.
      #
      # Antes eran opcionales y su bloque se auto-saltaba: el job terminaba
      # verde con 13 pruebas omitidas y el reporte lo contaba como cobertura
      # completa. Los crea `scripts/seed-rls-sandbox.mjs`, que además verifica
      # el login de cada uno y comprueba que sus permisos efectivos son los que
      # la suite supone.
      RLS_USER_PAQ_EMAIL: ${{ secrets.RLS_USER_PAQ_EMAIL }}
      RLS_USER_PAQ_PASSWORD: ${{ secrets.RLS_USER_PAQ_PASSWORD }}
      RLS_USER_CORR_EMAIL: ${{ secrets.RLS_USER_CORR_EMAIL }}
      RLS_USER_CORR_PASSWORD: ${{ secrets.RLS_USER_CORR_PASSWORD }}
      RLS_USER_ADMIN_EMAIL: ${{ secrets.RLS_USER_ADMIN_EMAIL }}
      RLS_USER_ADMIN_PASSWORD: ${{ secrets.RLS_USER_ADMIN_PASSWORD }}
      RLS_USER_OWNER_EMAIL: ${{ secrets.RLS_USER_OWNER_EMAIL }}
      RLS_USER_OWNER_PASSWORD: ${{ secrets.RLS_USER_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # ── Preflight FAIL-CLOSED ────────────────────────────────────────────
      #
      # Antes este gate miraba UNA sola variable (RLS_SUPABASE_URL) y, si
      # faltaba, dejaba el job VERDE con un warning. Dos agujeros:
      #
      #   1. Con la URL puesta pero (por ejemplo) RLS_USER_B_PASSWORD vacía, el
      #      job entraba a correr, el harness se auto-saltaba por su propio
      #      ENABLED y terminaba verde con CERO pruebas. Verde sin ejecutar,
      #      otra vez, y esta vez sin ni siquiera el warning.
      #   2. Un verde por omisión es indistinguible de un verde por
      #      verificación. La rama protegida lo contaba como cobertura.
      #
      # El preflight comprueba además el DESTINO —dominio Supabase reconocido,
      # ref de producción rechazado, y ref igual a RLS_EXPECTED_PROJECT_REF—
      # ANTES de setup-node y de `npm ci`: si el destino no está declarado, el
      # job termina sin haber instalado nada ni abierto ninguna conexión.
      # La misma validación (scripts/rls-destino.mjs) la repiten el seed y el
      # propio harness, como defensa en profundidad.
      #
      # La decisión vive en `scripts/rls-preflight.mjs` (Node, no inline en el
      # YAML) para poder PROBARLA: `scripts/__tests__/rls-preflight.test.mjs`
      # cubre los cuatro contextos — fork, Dependabot, PR interno y push a main.
      #
      # Node 22 viene preinstalado en el runner, así que este paso corre ANTES
      # de setup-node y de npm ci: sin secretos no se instala nada.
      - name: Preflight fail-closed de los secretos RLS_*
        id: preflight
        env:
          # `head.repo.fork` sólo existe en eventos pull_request; en push a main
          # queda vacío → se trata como interno → fail-closed. Correcto.
          ES_FORK: ${{ github.event.pull_request.head.repo.fork }}
          # Dependabot no recibe los Actions secrets: en `pull_request` se
          # identifica como contexto estructural, pero el desenlace sigue siendo
          # ROJO. Un verde ahí autorizaría a fusionar sin verificar, y el fallo
          # posterior en `main` sería detección, no prevención.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/rls-preflight.mjs

      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.run == 'true'
        run: npm ci

      # El reporte JSON es la EVIDENCIA de que se ejecutaron pruebas. `vitest run`
      # sobre un harness auto-saltado termina en 0 con cero tests, así que el
      # exit code por sí solo no distingue "verificado" de "omitido".
      - name: Run RLS harness
        if: steps.preflight.outputs.run == 'true'
        run: |
          npx vitest run src/test/rls/rlsHarness.test.ts \
            --reporter=default \
            --reporter=json --outputFile=rls-report.json

      # Fail-closed de salida: pruebas > 0, sin fallos, sin skips/todos
      # inesperados y con TODOS los escenarios obligatorios de coverage.json
      # presentes como pruebas pasadas, más CADA RPC crítica nombrada una a una.
      # El piso numérico es la red secundaria, no el criterio principal.
      - name: Verificar que el harness ejecutó los escenarios obligatorios
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/assert-rls-ejecutado.mjs rls-report.json

      # El reporte sólo contiene nombres de prueba y recuentos (literales del
      # repo): ningún valor de secreto, ninguna URL de sandbox, ningún token.
      - name: Upload reporte del harness RLS
        if: ${{ steps.preflight.outputs.run == 'true' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rls-report-${{ github.run_id }}
          path: rls-report.json
          retention-days: 14
          if-no-files-found: warn
