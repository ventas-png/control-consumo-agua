project_id = "nnsqmeigtgewatameexo"

# Funciones que manejan su propia autenticación (deploy con --no-verify-jwt).
[functions.create-cliente-account]
verify_jwt = false

[functions.create-user]
verify_jwt = false

[functions.delete-user]
verify_jwt = false

# Purga definitiva de empresas: valida el JWT del super_admin manualmente via
# _shared/auth.requireUser, igual que delete-user.
[functions.delete-company]
verify_jwt = false

[functions.log-security-event]
verify_jwt = false

[functions.complete-oauth-onboarding]
verify_jwt = false

# Backfill de cifrado de secretos por tenant (P0 #7, fase MIGRATE): operación de
# operador que recifra las filas en texto plano. verify_jwt=false: autentica a
# mano con service_role o x-cron-secret; exige TENANT_SECRETS_ENC_KEY.
[functions.backfill-tenant-secrets]
verify_jwt = false

# Recordatorios de rutas: autentica con service key (cron) o JWT de admin.
[functions.route-reminders]
verify_jwt = false

# Aviso de paquete al residente: autentica con service key o JWT de la empresa.
[functions.notify-package]
verify_jwt = false

# Signup self-service: publico por diseño, valida origen + fuerza de la
# password + email confirmation de Supabase Auth.
[functions.signup-company]
verify_jwt = false

# Stripe Platform webhook: publico, valida HMAC signature con
# STRIPE_PLATFORM_WEBHOOK_SECRET. JWT seria contraproducente — Stripe no
# envia auth header.
[functions.stripe-platform-webhook]
verify_jwt = false

# Invitar usuario (T3/plat:P3): valida el JWT del admin/owner manualmente via
# _shared/auth.requireUser, igual que create-user.
[functions.invite-user]
verify_jwt = false

# Crear comunicado masivo (T2/com:N5): resuelve la audiencia y el fan-out en el
# servidor (broadcast_recipients + encola emails en notifications_outbox). Valida
# el JWT del admin/owner a mano via _shared/auth.requireUser, igual que create-user.
[functions.create-broadcast]
verify_jwt = false

# Dispatcher de notificaciones (T2): lo invoca pg_cron cada minuto via
# run_notifications_dispatcher() con SERVICE_ROLE_KEY (o x-cron-secret). Procesa
# notifications_outbox y entrega por canal, respetando preferencias (suppressed) y
# registrando notification_events. verify_jwt=false: hace su propio control de
# acceso interno (Bearer service_role / cron secret), no JWT de usuario.
[functions.notifications-dispatcher]
verify_jwt = false

# Aceptar invitacion (T3/plat:P3): publico/sessionless por diseno — el invitado
# todavia no tiene cuenta. Valida el token de invitacion + origen + fuerza de la
# password server-side.
[functions.accept-invitation]
verify_jwt = false

# Timbrar documento fiscal (serv:S11): nucleo FEL/CFDI provider-agnostic. Valida
# el token a mano (service_role interno o JWT admin/owner del tenant), arma el DTE
# canonico y lo timbra via el adapter (hoy SandboxProvider). Sin HTTP a PAC real.
[functions.timbrar-documento]
verify_jwt = false

# serv:S11 — "probar conexion" al PAC. Resuelve la config fiscal efectiva
# (override locacion<->empresa), pingea via el adapter (hoy Sandbox) y guarda el
# estatus en fiscal_pac_secrets. verify_jwt=false: valida el token a mano
# (service_role o JWT admin/owner). NUNCA expone el secreto. Sin HTTP a PAC real.
[functions.fiscal-test-connection]
verify_jwt = false

# serv:S11 — guardar credenciales del PAC en la boveda fiscal_pac_secrets
# (deny-all bajo RLS). El cliente NO escribe directo: invoca este edge, que con
# service_role hace el upsert por (company_id, project_id). verify_jwt=false:
# valida el token a mano (service_role o JWT admin/owner del tenant). NUNCA
# devuelve el secreto; al guardar resetea estado_conexion a 'desconocido'.
[functions.fiscal-save-credentials]
verify_jwt = false

# Cobros pluggable — crear un cobro con el payfac EFECTIVO del tenant (sandbox/
# qpaypro/...), provider-agnostic. Valida el token a mano (service_role o JWT de
# un usuario del tenant), resuelve el payfac efectivo, carga credenciales de la
# boveda y llama provider.crearCobro(). No pasa datos de tarjeta por el servidor.
[functions.create-charge]
verify_jwt = false

# Confirma+concilia server-side un cobro en línea de cuota (F1) o recibo de agua
# (F2). verify_jwt=false: autentica a mano (service_role/cron, usuario de tenant, o
# residente dueño del ítem); marca el pago solo si el provider reporta 'aprobado'.
# Idempotente por provider_ref.
[functions.confirm-charge]
verify_jwt = false

# Cobros pluggable — "probar conexion" al payfac. Resuelve la config de pago
# efectiva (override locacion<->empresa), carga credenciales del ambiente y pingea
# via el adapter (sandbox ok; qpaypro valida credenciales). Guarda el estatus en
# payfac_secrets. verify_jwt=false: valida el token a mano. NUNCA expone el secreto.
[functions.payfac-test-connection]
verify_jwt = false

# Cobros pluggable — guardar credenciales del payfac en la boveda payfac_secrets
# (deny-all bajo RLS). El cliente NO escribe directo: invoca este edge, que con
# service_role hace el upsert por (company_id, project_id) con merge por ambiente.
# verify_jwt=false: valida el token a mano (service_role o JWT admin/owner). NUNCA
# devuelve el secreto; al guardar resetea estado_conexion a 'desconocido'.
[functions.payfac-save-credentials]
verify_jwt = false

# Validación server-side de uploads (infra:I13). Recibe el archivo, valida
# magic-bytes vs MIME declarado + tamaño por bucket + saneo de SVG (lógica pura en
# _shared/uploadValidation.ts) y, si pasa, sube a Storage con el JWT del llamador
# (las RLS de storage.objects imponen el tenant). verify_jwt=false: valida el JWT a
# mano via requireUser (consistente con el resto de funciones del repo).
[functions.validate-upload]
verify_jwt = false

# SSO/SAML enterprise (plat:P10) — admin de dominios + proveedor SAML por tenant.
# Deriva company_id de la SESION (nunca del input), exige owner/admin y gestiona
# SOLO los dominios/proveedor de ESA empresa en company_sso_domains. Intenta
# registrar/sincronizar el proveedor SAML via GoTrue Admin SSO API; si SSO no esta
# habilitado en el proyecto, responde "parqueado" pero igual persiste la config.
# verify_jwt=false: valida el token a mano (service_role o JWT admin/owner).
[functions.sso-admin]
verify_jwt = false
